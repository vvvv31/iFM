server:
  port: 8080

spring:
  application:
    name: ifm_service

  datasource:
    url: jdbc:mysql://localhost:3306/ifm_service_v3_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&useUnicode=true
    username: root
    password: "00000000"

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        show_sql: true
    # 添加以下配置
    database-platform: org.hibernate.dialect.MySQLDialect


  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

# ✅ 文件上传配置 - 使用绝对路径
file:
  upload:
    # 使用绝对路径确保文件能保存到正确位置
    base-path: d:/SE/github//iFM/backend/uploads



audio:
  upload-path: ${user.dir}/uploads

logging:
  level:
    org.springframework.web: DEBUG
    org.hibernate: DEBUG