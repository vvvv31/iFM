spring:
  application:
    name: ifm_service

  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password: password
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

server:
  port: 8080

audio:
  upload-path: ${user.dir}/uploads

logging:
  level:
    org.springframework.web: DEBUG
    org.hibernate: DEBUG