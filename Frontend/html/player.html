<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>课程播放 - 星之声</title>

  <style>
    :root{
      --left-w: 300px;
      --right-w: 300px;
      --gap: 20px;
      --album-size: 360px;
      --album-rect-expanded-width: 760px;
      --album-height: 360px;
      --sub-font-size: 16px;
      --sub-line-height: 1.75;
      --sub-font-weight: 400;
      --sub-font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans CJK SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; background:#fff; color:#333; }
    .header { display:flex; align-items:center; gap:20px; padding:12px 20px; border-bottom:1px solid #eee; background: #fff; }
    .logo { display:flex; align-items:center; gap:8px; }
    .logo-img { width:36px; height:36px; border-radius:6px; background:#ffefd5; }
    .logo-text { font-weight:700; font-size:18px; color:#333; }
    .main-nav { display:flex; gap:12px; margin-left:12px; }
    .nav-item { color:#666; text-decoration:none; padding:6px 8px; border-radius:6px; }
    .nav-item.active { background:#fff4e6; color:#ff8c00; font-weight:600; }
    .search-box { margin-left:auto; display:flex; gap:8px; align-items:center; }
    .search-input { padding:6px 10px; border:1px solid #eee; border-radius:6px; }
    .search-btn { background:#ff8c00; color:#fff; border:0; padding:6px 10px; border-radius:6px; cursor:pointer; }
    .user-functions { display:flex; gap:10px; align-items:center; margin-left:12px; }
    .func-item { color:#666; text-decoration:none; font-size:14px; display:flex; gap:6px; align-items:center; }
    .submit-btn { background:#ff8c00; color:#fff; border:0; padding:6px 10px; border-radius:6px; cursor:pointer; }

    main.main-content.player-main { padding: 20px; max-width: 1300px; margin: 0 auto; }

    .player-container { display: grid; grid-template-columns: var(--left-w) 1fr var(--right-w); gap: var(--gap); align-items: start; }

    .chapter-sidebar, .recommend-sidebar { background:#fff; border-radius:8px; box-shadow:0 6px 18px rgba(0,0,0,0.05); padding:12px; }
    .sidebar-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
    .chapter-list { display:flex; flex-direction:column; gap:6px; }
    .chapter-item { display:flex; align-items:center; justify-content:space-between; padding:8px; border-radius:6px; cursor:pointer; background:#fff; }
    .chapter-item:hover { background:#fffaf6; }
    .chapter-item.active { background:#fff8f0; border-left:3px solid #ff9a2a; font-weight:700; color:#ff7a00; }

    .recommend-list { display:flex; flex-direction:column; gap:10px; }
    .recommend-item { display:flex; gap:10px; align-items:center; padding:10px; border-radius:8px; background:#fffaf5; cursor:pointer; }
    .recommend-cover { width:56px; height:56px; border-radius:8px; background:#ffeede; display:flex; align-items:center; justify-content:center; font-weight:700; color:#ff7a00; }

    .player-main-area { display:flex; flex-direction:column; gap:18px; }
    .player-header .course-title { margin:0; font-size:20px; font-weight:700; text-align:center; }
    .player-header .course-subtitle { margin:4px 0 0 0; color:#777; text-align:center; }

    .player-content { display:flex; flex-direction:column; gap:16px; align-items:center; position:relative; width:100%; max-width:900px; }

    .player-album { display:flex; align-items:center; justify-content:center; width:100%; }

    .album-cover {
      width: 280px;
      height: 280px;
      background-color: #E0FFFF;
      border: 3px solid #FF8C00;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      box-shadow: 0 8px 25px rgba(255, 140, 0, 0.2);
      transition: width 280ms ease, height 280ms ease;
    }
    .album-image {
      width: var(--album-size);
      height: var(--album-size);
      border-radius: 12px;
      background: #fbf3e6;
      display:flex;
      align-items:center;
      justify-content:center;
      box-shadow: 0 0 0 8px #e6fbf9 inset;
      transition: width 280ms ease, height 280ms ease, box-shadow 280ms ease, border-radius 280ms ease;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }
    .inner-art { transition: opacity 180ms ease; }
    .subtitle-panel { position:absolute; left:12px; right:12px; top:12px; bottom:12px; background: rgba(255,255,255,0.96); border-radius:8px; padding:10px; display:flex; flex-direction:column; gap:8px; box-shadow:0 8px 20px rgba(0,0,0,0.06); overflow:hidden; }

    .player-controls-large { display:flex; flex-direction:column; gap:8px; align-items:center; width:100%; }
    .controls-top { display:flex; align-items:center; justify-content:center; gap:12px; width:100%; }
    .controls-top .volume-wrap { display:flex; gap:8px; align-items:center; }
    .controls-bottom { display:flex; align-items:center; justify-content:center; gap:16px; width:100%; }
    .control-side { display:flex; align-items:center; gap:8px; min-width:72px; justify-content:center; }
    .control-btn-large { background:transparent; border:0; font-size:20px; cursor:pointer; color:#444; display:inline-flex; align-items:center; justify-content:center; padding:6px; }
    .play-btn-large { font-size:32px; border:0; background:transparent; cursor:pointer; color:#ff8c00; display:inline-flex; align-items:center; justify-content:center; padding:6px; }
    .mini-btn { background:transparent; border:0; cursor:pointer; color:#444; padding:6px; border-radius:6px; display:inline-flex; align-items:center; justify-content:center; }
    .mini-btn:hover { color:#ff8c00; background:#fff8f0; }
    .mode-popover, .rate-popover { position:absolute; bottom:calc(100% + 8px); left:50%; transform:translateX(-50%); background:#fff; border:1px solid #ddd; border-radius:8px; box-shadow:0 10px 24px rgba(0,0,0,0.12); padding:8px; display:none; z-index:1000; }
    .popover.show { display:flex; }
    .mode-options { display:flex; gap:8px; }
    .mode-item { width:40px; height:40px; border-radius:8px; border:1px solid #eee; display:inline-flex; align-items:center; justify-content:center; cursor:pointer; color:#444; }
    .mode-item:hover { color:#ff8c00; border-color:#ffeed6; background:#fff9f0; }
    .mode-item.active { color:#fff; background:#ff8c00; border-color:#ff8c00; }
    .rate-list { display:flex; flex-direction:column; min-width:120px; }
    .rate-item { padding:8px 12px; cursor:pointer; border-radius:6px; color:#333; }
    .rate-item:hover { background:#f7f7f7; }
    .rate-item.active { color:#ff8c00; font-weight:700; background:#fff4e6; }

    .volume-bar { width:260px; max-width:80vw; height:8px; background:#eee; border-radius:8px; position:relative; cursor:pointer; overflow:hidden; }
    .volume-fill { height:100%; background:#ffb74d; width:50%; }

    .progress-container-large { display:flex; align-items:center; gap:12px; width:100%; }
    .progress-bar-large { flex:1; height:8px; background:#f1f1f1; border-radius:8px; overflow:hidden; position:relative; cursor: pointer; }
    .progress-fill-large { height:100%; background: linear-gradient(90deg,#ffd86b,#ffb94d); width:0%; }

    @media (max-width:1100px) {
      .player-container { grid-template-columns: 1fr; }
      :root { --album-size: 280px; }
    }

    audio { display:none !important; }

    .subtitle-header {
      display:flex; align-items:center; justify-content:space-between;
      gap:8px; padding:4px 0; border-bottom:1px solid #f0f0f0;
    }
    .subtitle-title { font-weight:700; color:#333; font-size:14px; }
    .subtitle-actions { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
    .sub-btn {
      border:1px solid #ffdcb3; background:#fff; color:#555; cursor:pointer;
      padding:6px 10px; border-radius:8px; font-size:12px;
    }
    .sub-btn.primary { background:#ff8c00; border-color:#ff8c00; color:#fff; }
    .subtitle-scroll { flex:1; overflow-y:auto; padding:8px 2px; margin-top:6px; }
    .cue-item {
      padding: 8px 10px;
      border-radius: 8px;
      color: #333;
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      gap: 8px;
      transition: background-color 0.2s ease;
    }
    .cue-item:hover { background-color: #fff9f0; }
    .cue-item.active { background: #fff3e0; border-left: 3px solid #ff9a2a; font-weight: 500; }
    .cue-time { flex:0 0 auto; font-size:12px; color:#999; min-width:54px; text-align:right; font-variant-numeric:tabular-nums; }
    .cue-text { flex:1; white-space:pre-wrap; word-break:break-word; }
    .subtitle-empty { color:#888; font-size:13px; text-align:center; padding:20px 6px; }

    .subtitle-panel { font-family: var(--sub-font-family); }
    .cue-item .cue-text {
      font-size: var(--sub-font-size);
      line-height: var(--sub-line-height);
      font-weight: var(--sub-font-weight);
    }

    .album-cover.subtitles-open { width: 600px; height: 280px; }
    .album-cover.subtitles-open .subtitle-panel {
      position: absolute; left: 0; right: 0; top: 0; bottom: 0;
      border-radius: 12px; padding: 12px; background: rgba(255,255,255,0.96); box-shadow: none;
    }
    @media (max-width: 700px) { .album-cover.subtitles-open { width: 100%; height: 280px; } }
    
    .connection-status {
      position: fixed;
      top: 10px;
      right: 10px;
      padding: 5px 10px;
      border-radius: 15px;
      font-size: 12px;
      z-index: 10000;
      display: none;
    }
    .connection-status.connected {
      display: block;
      background-color: #4caf50;
      color: white;
    }
    .connection-status.disconnected {
      display: block;
      background-color: #f44336;
      color: white;
    }
  </style>
</head>
<body>
  <!-- 连接状态指示器 -->
  <div id="connectionStatus" class="connection-status"></div>
  
  <!-- TOP NAV -->
  <header class="header">
    <div class="logo">
      <div class="logo-img"></div>
      <span class="logo-text">星之声</span>
    </div>
    <nav class="main-nav">
      <a href="index.html" class="nav-item">首页</a>
      <a href="category.html" class="nav-item">分类</a>
      <a href="channel.html" class="nav-item">社区</a>
    </nav>
    <div class="search-box">
      <input type="text" placeholder="搜索课程、频道..." class="search-input" id="homeSearchInput">
      <button class="search-btn" id="homeSearchBtn">搜索</button>
    </div>
    <div class="user-functions">
      <a href="my-message.html" class="func-item">消息</a>
      <a href="my-collect.html" class="func-item">收藏</a>
      <a href="my-recent.html" class="func-item">历史</a>
      <a href="my-creator_center.html" class="func-item">创作中心</a>
      <a href="login.html"><button class="submit-btn">登录/注册</button></a>
    </div>
  </header>

  <!-- MAIN CONTENT -->
  <main class="main-content player-main">
    <div class="player-container">
      <!-- LEFT: chapter list -->
      <aside class="chapter-sidebar" aria-labelledby="chapters-title">
        <div class="sidebar-header">
          <h2 id="chapters-title">课程章节</h2>
          <button id="syncBtn" class="mini-btn" title="从播放栏同步" aria-label="同步">
            同步
          </button>
        </div>
        <div class="chapter-list" id="chapterList">
          <div class="chapter-item placeholder">加载中…</div>
        </div>
      </aside>

      <!-- CENTER: player area -->
      <section class="player-main-area" aria-label="播放器主区域">
        <div class="player-header">
          <h1 class="course-title" id="courseTitle">示例课程</h1>
          <p class="course-subtitle" id="courseAuthor">示例作者</p>
        </div>

        <div class="player-content">
          <div class="player-album">
            <div class="album-cover" id="albumCover">
              <div class="album-image" id="albumImage" role="button" tabindex="0" aria-label="切换字幕模式">
                <div class="inner-art" id="innerArt" aria-hidden="true">
                  点击显示字幕
                </div>
                <div id="subtitlePlaceholder" style="display:none;" aria-hidden="true"></div>
              </div>
            </div>
          </div>

          <!-- Controls -->
          <div class="player-controls-large">
            <div class="controls-top">
              <div class="volume-wrap">
                <button id="muteBtn" class="mini-btn" title="静音/取消静音" aria-label="静音">
                  音量
                </button>
                <div id="volBar" class="volume-bar" title="音量">
                  <div id="volFill" class="volume-fill"></div>
                </div>
              </div>
            </div>

            <div class="controls-bottom">
              <!-- 播放模式按钮 - 使用和播放栏相同的结构 -->
              <div class="control-side" style="position:relative;">
                <div style="position:relative;">
                  <button id="modeBtn" class="mini-btn" title="播放模式" aria-label="播放模式" style="display:flex; align-items:center; gap:4px;">
                    <svg class="icon" viewBox="0 0 24 24" style="width:16px; height:16px;"><path d="M7 7h8v3l4-4-4-4v3H5v6h2V7zm10 10H9v-3l-4 4 4 4v-3h10v-6h-2v4z"></path></svg>
                    <span id="modeText" style="font-size:12px; font-weight:bold;">列表</span>
                  </button>
                  <div id="modePop" class="popover mode-popover" aria-hidden="true">
                    <div class="mode-item" data-mode="single" title="单曲循环">
                      <svg class="icon" viewBox="0 0 24 24"><path d="M12 5v4l-1.5-1.5C8 10 8 14 10.5 16.5S16 19 18.5 16.5L20 18c-3 3-8 3-11 0S6 9 9 6L12 5z"></path></svg>
                    </div>
                    <div class="mode-item active" data-mode="list" title="歌单顺序循环">
                      <svg class="icon" viewBox="0 0 24 24"><path d="M4 6h12v2H4V6zm0 5h12v2H4v-2zm0 5h8v2H4v-2zm15-7l-3 3h2v4h2v-4h2l-3-3z"></path></svg>
                    </div>
                    <div class="mode-item" data-mode="shuffle" title="歌单乱序循环">
                      <svg class="icon" viewBox="0 0 24 24"><path d="M16 3h5v5h-2V6.41l-4.29 4.3-1.42-1.42L17.59 5H16V3zM4 6h7l2 2H4V6zm0 6h5l2 2H4v-2zm12 3h1.59l-2.29 2.29 1.42 1.42L20 17.41V19h2v-5h-5v2z"></path></svg>
                    </div>
                  </div>
                </div>
              </div>

              <div style="display:flex; align-items:center; gap:12px;">
                <button class="control-btn-large prev-btn" id="page-prev" title="上一章">上一首</button>
                <button class="play-btn-large play-active" id="page-play" title="播放/暂停">播放</button>
                <button class="control-btn-large next-btn" id="page-next" title="下一章">下一首</button>
              </div>

              <!-- 倍速按钮 - 使用和播放栏相同的结构 -->
              <div class="control-side" style="position:relative;">
                <div style="position:relative;">
                  <button id="rateBtn" class="mini-btn" title="倍速" aria-label="倍速" style="display:flex; align-items:center; gap:4px;">
                    <span id="rateText" style="font-size:12px; font-weight:bold;">1x</span>
                  </button>
                  <div id="ratePop" class="popover rate-popover" aria-hidden="true">
                    <div class="rate-item" data-rate="0.5">0.5x</div>
                    <div class="rate-item active" data-rate="1">1.0x</div>
                    <div class="rate-item" data-rate="1.5">1.5x</div>
                    <div class="rate-item" data-rate="2">2.0x</div>
                  </div>
                </div>
              </div>

            </div>
          </div>

          <div class="progress-container-large">
            <span class="time current" id="page-time-cur">00:00</span>
            <div class="progress-bar-large" id="page-progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0">
              <div class="progress-fill-large" id="page-progress-fill"></div>
            </div>
            <span class="time total" id="page-time-total">00:00</span>
          </div>

          <div class="current-chapter">
            <h3 id="now-playing">未播放</h3>
            <p id="now-duration"></p>
          </div>
        </div>
      </section>

      <!-- RIGHT: recommendations -->
      <aside class="recommend-sidebar" aria-labelledby="recommend-title">
        <div class="sidebar-header">
          <h2 id="recommend-title">推荐课程</h2>
        </div>
        <div class="recommend-list" id="recommendList">
          <div class="recommend-item placeholder">加载中…</div>
        </div>
      </aside>
    </div>
  </main>

  <!-- 独立模式下的音频元素 -->
  <audio id="audioPlayer" preload="metadata" style="display: none;"></audio>

  <script>
  (function () {
    console.log('播放页初始化开始');
    
    // 检测是否在iframe中
    const isInFrame = window !== window.parent;
    console.log('是否在iframe中:', isInFrame);
    
    // 连接状态
    let isConnectedToParent = false;
    const connectionStatusEl = document.getElementById('connectionStatus');
    
    function updateConnectionStatus(connected) {
      isConnectedToParent = connected;
      if (connected) {
        connectionStatusEl.textContent = '已连接到播放栏';
        connectionStatusEl.className = 'connection-status connected';
      } else {
        connectionStatusEl.textContent = '未连接到播放栏';
        connectionStatusEl.className = 'connection-status disconnected';
      }
    }

    // 音频元素 - 只在独立模式下使用
    const audio = document.getElementById('audioPlayer');
    
    // 如果是在iframe中，隐藏音频元素
    if (isInFrame) {
      audio.style.display = 'none';
    }
    
    // DOM 元素引用
    const chapterListEl = document.getElementById('chapterList');
    const recommendListEl = document.getElementById('recommendList');
    const courseTitleEl = document.getElementById('courseTitle');
    const courseAuthorEl = document.getElementById('courseAuthor');
    const syncBtn = document.getElementById('syncBtn');

    const playBtn = document.getElementById('page-play');
    const prevBtn = document.getElementById('page-prev');
    const nextBtn = document.getElementById('page-next');
    const progressFill = document.getElementById('page-progress-fill');
    const progressBar = document.getElementById('page-progress-bar');
    const timeCur = document.getElementById('page-time-cur');
    const timeTotal = document.getElementById('page-time-total');
    const nowPlaying = document.getElementById('now-playing');
    const nowDuration = document.getElementById('now-duration');

    const albumCover = document.getElementById('albumCover');
    const albumImage = document.getElementById('albumImage');
    const innerArt = document.getElementById('innerArt');
    const subtitlePlaceholder = document.getElementById('subtitlePlaceholder');

    // 播放模式相关元素
    const modeBtn = document.getElementById('modeBtn');
    const modeText = document.getElementById('modeText');
    const modePop = document.getElementById('modePop');
    const modeItems = modePop ? modePop.querySelectorAll('.mode-item') : [];
    
    // 倍速相关元素
    const rateBtn = document.getElementById('rateBtn');
    const rateText = document.getElementById('rateText');
    const ratePop = document.getElementById('ratePop');
    const rateItems = ratePop ? ratePop.querySelectorAll('.rate-item') : [];
    
    // 音量相关元素
    const muteBtn = document.getElementById('muteBtn');
    const volBar = document.getElementById('volBar');
    const volFill = document.getElementById('volFill');
    const volIcon = document.getElementById('volIcon');

    // 播放状态变量
    let playlist = []; // 播放列表
    let index = 0; // 当前播放索引
    let playMode = 'list'; // 播放模式
    let isPlaying = false; // 播放状态
    let volume = 0.7; // 音量
    let muted = false; // 静音状态
    let playbackRate = 1.0; // 播放倍速
    let syncInterval = null; // 同步定时器
    let currentAudioDuration = 0; // 当前音频时长
    
    // ============ 从URL参数获取状态 ============
    function getStateFromURL() {
      try {
        const urlParams = new URLSearchParams(window.location.search);
        const stateParam = urlParams.get('state');
        
        if (stateParam) {
          console.log('从URL参数获取状态');
          const decodedState = decodeURIComponent(atob(stateParam));
          return JSON.parse(decodedState);
        }
      } catch (e) {
        console.error('解析URL状态失败:', e);
      }
      return null;
    }
    
    // ============ 从父窗口获取播放状态 ============
    function fetchParentPlayerState() {
      if (isInFrame && window.parent) {
        try {
          // 首先尝试使用postMessage请求状态
          window.parent.postMessage({
            type: 'GET_STATE_REQUEST'
          }, '*');
          
          // 然后尝试直接调用父窗口的PlayerBar
          if (window.parent.PlayerBar) {
            const state = window.parent.PlayerBar.getState();
            if (state) {
              console.log('通过PlayerBar.getState()获取到状态');
              return state;
            }
          }
        } catch (e) {
          console.warn('获取父窗口状态失败:', e);
        }
      }
      return null;
    }
    
    // ============ 初始化从父窗口或URL ============
    function initFromParentOrURL() {
      console.log('尝试从父窗口或URL初始化');
      
      // 首先尝试从URL获取状态
      const urlState = getStateFromURL();
      if (urlState) {
        console.log('从URL成功获取状态');
        updateConnectionStatus(true);
        updateUIFromParentState(urlState);
        return true;
      }
      
      // 如果URL没有状态，尝试从父窗口获取
      if (isInFrame) {
        const parentState = fetchParentPlayerState();
        if (parentState) {
          console.log('从父窗口成功获取状态');
          updateConnectionStatus(true);
          updateUIFromParentState(parentState);
          return true;
        }
      }
      
      console.log('无法从父窗口或URL获取状态');
      updateConnectionStatus(false);
      return false;
    }
    
    // ============ 从父窗口状态更新UI ============
    function updateUIFromParentState(state) {
      if (!state) return;
      
      console.log('更新UI从状态:', state);
      
      // 更新播放列表和当前索引
      if (state.playlist && state.playlist.length) {
        playlist = state.playlist;
        if (state.currentIndex !== undefined) {
          index = state.currentIndex;
        }
      }
      
      // 更新播放状态
      isPlaying = state.isPlaying || false;
      
      // 更新播放按钮
      updatePlayButtonUI();
      
      // 更新进度条
      const currentTime = state.currentTime || 0;
      const duration = state.duration || 0;
      currentAudioDuration = duration; // 保存当前音频时长
      const progressPercent = duration > 0 ? (currentTime / duration) * 100 : 0;
      progressFill.style.width = `${progressPercent}%`;
      progressBar.setAttribute('aria-valuemax', Math.floor(duration));
      progressBar.setAttribute('aria-valuenow', Math.floor(currentTime));
      
      // 更新时间显示
      timeCur.textContent = formatTime(currentTime);
      timeTotal.textContent = formatTime(duration);
      
      // 更新音量
      if (state.volume !== undefined) {
        volume = state.volume;
      }
      if (state.muted !== undefined) {
        muted = state.muted;
      }
      volFill.style.width = muted ? '0%' : `${volume * 100}%`;
      
      // 更新倍速
      if (state.playbackRate !== undefined) {
        playbackRate = state.playbackRate;
        rateText.textContent = playbackRate.toFixed(1) + 'x';
        updateRateUI();
      }
      
      // 更新播放模式
      if (state.playMode) {
        playMode = state.playMode;
        updateModeUI();
        updateModeText();
      }
      
      // 更新当前播放信息
      updateNowPlayingUI(index);
      
      // 更新章节列表
      renderChapterList();
      
      // 更新课程标题和作者
      const currentTrack = playlist[index];
      if (currentTrack) {
        courseTitleEl.textContent = currentTrack.title;
        courseAuthorEl.textContent = currentTrack.artist || '未知作者';
      }
      
      // 更新字幕（如果正在显示字幕）
      if (showSubtitles) {
        updateActiveCueByTime(currentTime);
      }
    }
    
    // ============ 调用父窗口播放栏的控制方法 ============
    function callParentPlayer(method, ...args) {
      if (window.parent && window !== window.parent) {
        try {
          console.log('调用父窗口播放栏方法:', method, args);
          
          // 构建控制请求
          const controlRequest = {
            type: 'CONTROL_REQUEST',
            data: {
              action: method,
              value: args[0]
            }
          };
          
          // 发送到父窗口
          window.parent.postMessage(controlRequest, '*');
          
          return true;
        } catch (e) {
          console.warn(`调用父窗口播放栏方法 ${method} 失败`, e);
        }
      }
      return false;
    }
    
    // ===== 核心播放控制函数 =====
    
    // 播放/暂停
    function togglePlay() {
      if (isInFrame && isConnectedToParent) {
        // 在iframe中，控制父窗口播放栏
        callParentPlayer('togglePlay');
        // 乐观更新本地状态
        isPlaying = !isPlaying;
        updatePlayButtonUI();
      } else {
        // 独立模式，控制本地音频
        if (audio.paused) {
          audio.play().then(() => {
            isPlaying = true;
            updatePlayButtonUI();
          }).catch(err => console.error('播放失败:', err));
        } else {
          audio.pause();
          isPlaying = false;
          updatePlayButtonUI();
        }
      }
    }
    
    // 上一首
    function playPrev() {
      if (isInFrame && isConnectedToParent) {
        callParentPlayer('prev');
      } else {
        if (index > 0) {
          playTrackByIndex(index - 1);
        }
      }
    }
    
    // 下一首
    function playNext() {
      if (isInFrame && isConnectedToParent) {
        callParentPlayer('next');
      } else {
        if (index < playlist.length - 1) {
          playTrackByIndex(index + 1);
        } else if (playMode === 'list') {
          playTrackByIndex(0);
        }
      }
    }
    
    // 播放指定索引的歌曲
    function playTrackByIndex(i) {
      if (i < 0 || i >= playlist.length) return;
      
      if (isInFrame && isConnectedToParent) {
        // 在iframe中，控制父窗口播放栏
        callParentPlayer('playIndex', i);
        index = i;
      } else {
        // 独立模式，播放本地音频
        index = i;
        const track = playlist[index];
        if (track && track.src) {
          audio.src = track.src;
          audio.load();
          audio.play().then(() => {
            isPlaying = true;
            updatePlayButtonUI();
          }).catch(err => console.error('播放失败:', err));
        }
      }
      
      highlightChapterUI(index);
      updateNowPlayingUI(index);
      
      // 重置字幕
      subtitleCues = [];
      lastActiveCueIndex = -1;
      if (showSubtitles) {
        ensureSubtitleCues().then(() => {
          buildSubtitlePanel();
          updateActiveCueByTime(getCurrentTime(), true);
        });
      }
    }
    
    // 设置音量
    function setVolume(vol) {
      vol = Math.max(0, Math.min(1, vol));
      volume = vol;
      
      if (isInFrame && isConnectedToParent) {
        callParentPlayer('setVolume', vol);
      } else {
        audio.volume = vol;
        audio.muted = false;
      }
      
      volFill.style.width = `${vol * 100}%`;
    }
    
    // 设置播放倍速
    function setPlaybackRate(rate) {
      rate = parseFloat(rate);
      playbackRate = rate;
      
      if (isInFrame && isConnectedToParent) {
        callParentPlayer('setPlaybackRate', rate);
      } else {
        audio.playbackRate = rate;
      }
      
      rateText.textContent = rate.toFixed(1) + 'x';
      updateRateUI();
    }
    
    // 设置播放模式
    function setPlayMode(mode) {
      playMode = mode;
      
      if (isInFrame && isConnectedToParent) {
        callParentPlayer('setPlayMode', mode);
      }
      
      updateModeUI();
      updateModeText();
    }
    
    // 切换静音
    function toggleMute() {
      muted = !muted;
      
      if (isInFrame && isConnectedToParent) {
        callParentPlayer('toggleMute');
      } else {
        audio.muted = muted;
      }
      
      volFill.style.width = muted ? '0%' : `${volume * 100}%`;
    }
    
    // 跳转到指定时间
    function seekTo(time) {
      if (isInFrame && isConnectedToParent) {
        callParentPlayer('seek', time);
      } else {
        if (audio.duration && isFinite(time)) {
          audio.currentTime = time;
        }
      }
    }

    function updatePlayButtonUI() {
      if (isPlaying) {
        playBtn.textContent = '暂停';

    function formatTime(sec) {
      if (!sec || isNaN(sec) || sec <= 0) return '00:00';
      const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
      return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    }
    
    function escapeHtml(str) { 
      return String(str || '').replace(/[&<>"']/g, m => ({ 
        '&':'&amp;',
        '<':'&lt;',
        '>':'&gt;',
        '"':'&quot;',
        "'":'&#39;' 
      }[m])); 
    }

    // ============ 进度条事件处理 ============
    function wireProgressBar() {
      let dragging = false;
      let seekTime = 0;
      
      function getAudioDuration() {
        return currentAudioDuration;
      }
      
      function handleProgressClick(e) {
        const rect = progressBar.getBoundingClientRect();
        const x = Math.max(0, Math.min(rect.width, e.clientX - rect.left));
        const p = x / rect.width;
        const duration = getAudioDuration();
        
        console.log('进度条点击:', { x, p, duration, currentAudioDuration });
        
        if (duration > 0) {
          const time = p * duration;
          seekTime = time;
          
          if (window.parent && window !== window.parent) {
            // 在iframe中，发送控制请求到父窗口
            const controlRequest = {
              type: 'CONTROL_REQUEST',
              data: {
                action: 'seek',
                value: time
              }
            };
            window.parent.postMessage(controlRequest, '*');
          } else {
            // 独立模式
            audio.currentTime = time;
          }
          
          // 乐观更新UI
          progressFill.style.width = `${p * 100}%`;
          timeCur.textContent = formatTime(time);
        }
      }
      
      // 点击事件
      progressBar.addEventListener('click', handleProgressClick);
      
      // 拖动事件
      progressBar.addEventListener('mousedown', (e) => {
        e.preventDefault();
        dragging = true;
        
        // 初始点击
        const rect = progressBar.getBoundingClientRect();
        const x = Math.max(0, Math.min(rect.width, e.clientX - rect.left));
        const p = x / rect.width;
        const duration = getAudioDuration();
        
        if (duration > 0) {
          seekTime = p * duration;
          progressFill.style.width = `${p * 100}%`;
          timeCur.textContent = formatTime(seekTime);
        }
        
        const handleMouseMove = (moveEvent) => {
          if (dragging) {
            const rect = progressBar.getBoundingClientRect();
            const x = Math.max(0, Math.min(rect.width, moveEvent.clientX - rect.left));
            const p = x / rect.width;
            const duration = getAudioDuration();
            
            if (duration > 0) {
              seekTime = p * duration;
              // 乐观更新UI
              progressFill.style.width = `${p * 100}%`;
              timeCur.textContent = formatTime(seekTime);
            }
          }
        };
        
        const handleMouseUp = (upEvent) => {
          dragging = false;
          
          // 最终更新
          const rect = progressBar.getBoundingClientRect();
          const x = Math.max(0, Math.min(rect.width, upEvent.clientX - rect.left));
          const p = x / rect.width;
          const duration = getAudioDuration();
          
          if (duration > 0) {
            const time = p * duration;
            seekTime = time;
            
            console.log('进度条拖拽结束，跳转到:', time, '秒');
            
            if (window.parent && window !== window.parent) {
              const controlRequest = {
                type: 'CONTROL_REQUEST',
                data: {
                  action: 'seek',
                  value: time
                }
              };
              window.parent.postMessage(controlRequest, '*');
            } else {
              audio.currentTime = time;
            }
          }
          
          document.removeEventListener('mousemove', handleMouseMove);
          document.removeEventListener('mouseup', handleMouseUp);
        };
        
        document.addEventListener('mousemove', handleMouseMove);
        document.addEventListener('mouseup', handleMouseUp);
      });
    }

    function onEndedHandle() {
      if (playMode === 'single') {
        if (isInFrame && isConnectedToParent) {
          callParentPlayer('seek', 0);
          callParentPlayer('play');
        } else {
          audio.currentTime = 0;
          audio.play();
        }
      } else if (playMode === 'shuffle') {
        if (!playlist.length) return;
        const next = Math.floor(Math.random() * playlist.length);
        playTrackByIndex(next);
      } else {
        if (index < playlist.length - 1) {
          playTrackByIndex(index + 1);
        } else if (playMode === 'list') {
          playTrackByIndex(0);
        }
      }
    }

    // ====== 字幕逻辑 ======
    let showSubtitles = false;
    let autoFollow = true;
    let subtitleCues = []; // [{start,end,text}]
    let lastActiveCueIndex = -1;

    function toTimeText(sec) {
      if (!isFinite(sec)) return '--:--';
      const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
      return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    }
    
    // 解析 WebVTT 简易版（要求 00:00:00.000 格式）
    function parseVTT(text) {
      const cues = [];
      const lines = String(text || '').split(/\r?\n/);
      let i = 0;
      function parseTS(ts) {
        const m = ts.trim().match(/(\d{2}):(\d{2}):(\d{2})(?:\.(\d{1,3}))?/);
        if (!m) return 0;
        return (+m[1])*3600 + (+m[2])*60 + (+m[3]) + ((+m[4]||0)/1000);
      }
      while (i < lines.length) {
        const ln = lines[i].trim();
        if (/-->/i.test(ln)) {
          const [a,b] = ln.split('-->');
          const start = parseTS(a), end = parseTS(b);
          i++;
          let textBuf = [];
          while (i < lines.length && lines[i].trim() !== '') {
            textBuf.push(lines[i]);
            i++;
          }
          cues.push({ start, end, text: textBuf.join('\n') });
        }
        i++;
      }
      return cues;
    }

    function buildSubtitlePanel() {
      subtitlePlaceholder.innerHTML = '';
      const panel = document.createElement('div');
      panel.className = 'subtitle-panel';
      panel.setAttribute('role','region');
      panel.setAttribute('aria-label','字幕');

      const header = document.createElement('div');
      header.className = 'subtitle-header';
      header.innerHTML = `
        <div class="subtitle-title">字幕</div>
        <div class="subtitle-actions" style="gap:10px; flex-wrap: wrap;">
          <button id="subAutoBtn" class="sub-btn">${autoFollow ? '自动跟随：开' : '自动跟随：关'}</button>
          <button id="subCloseBtn" class="sub-btn primary">关闭</button>
        </div>
      `;
      const scroll = document.createElement('div');
      scroll.className = 'subtitle-scroll';
      scroll.id = 'subtitleScroll';

      if (!subtitleCues.length) {
        const empty = document.createElement('div'); empty.className = 'subtitle-empty';
        empty.textContent = '暂无字幕或正在加载…';
        scroll.appendChild(empty);
      } else {
        subtitleCues.forEach((c, idx) => {
          const row = document.createElement('div');
          row.className = 'cue-item';
          row.dataset.index = String(idx);
          row.innerHTML = `<span class="cue-time">${toTimeText(c.start)}</span><div class="cue-text">${escapeHtml(c.text)}</div>`;
          
          // 添加点击事件：点击字幕跳转到对应时间点
          row.addEventListener('click', (e) => {
            e.stopPropagation();
            
            // 跳转到该字幕的开始时间
            seekTo(c.start);
            
            // 如果当前是暂停状态，则开始播放
            if (!isPlaying) {
              togglePlay();
            }
            
            // 立即更新激活状态
            updateActiveCueByTime(c.start, true);
          });
          
          // 添加悬停效果提示
          row.title = `点击跳转到 ${toTimeText(c.start)}`;
          
          scroll.appendChild(row);
        });
      }

      panel.appendChild(header);
      panel.appendChild(scroll);
      subtitlePlaceholder.appendChild(panel);

      // 事件处理
      const closeBtn = header.querySelector('#subCloseBtn');
      const autoBtn = header.querySelector('#subAutoBtn');

      // 阻止面板事件冒泡到外层
      panel.addEventListener('click', (e) => {
        e.stopPropagation();
        e.preventDefault();
        e.stopImmediatePropagation();
        return false;
      });

      closeBtn.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        e.stopImmediatePropagation();
        exitSubtitles();
        return false;
      });

      autoBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        autoFollow = !autoFollow;
        autoBtn.textContent = autoFollow ? '自动跟随：开' : '自动跟随：关';
      });
    }

    function enterSubtitles() {
      showSubtitles = true;
      albumCover.classList.add('subtitles-open');
      // 直接用内联样式控制内层宽度
      albumImage.style.width = '600px';
      albumImage.style.height = 'var(--album-size)';

      albumImage.setAttribute('aria-expanded','true');
      innerArt.style.display = 'none';
      subtitlePlaceholder.style.display = 'block';
      
      ensureSubtitleCues().then(() => {
        buildSubtitlePanel();
        updateActiveCueByTime(getCurrentTime(), true);
      });
    }
    
    function exitSubtitles() {
      showSubtitles = false;
      albumCover.classList.remove('subtitles-open');

      albumImage.style.width = '';
      albumImage.style.height = '';

      albumImage.removeAttribute('aria-expanded');
      subtitlePlaceholder.style.display = 'none';
      innerArt.style.display = 'block';
    }
    
    function getCurrentTime() {
      if (isInFrame && isConnectedToParent) {
        // 从父窗口获取时间
        const state = fetchParentPlayerState();
        return state ? (state.currentTime || 0) : 0;
      } else {
        return audio.currentTime || 0;
      }
    }

    function updateActiveCueByTime(t, forceScroll = false) {
      if (!subtitleCues.length) return;
      const idx = subtitleCues.findIndex(c => t >= c.start && t < c.end);
      if (idx === -1) return;
      if (idx === lastActiveCueIndex && !forceScroll) return;
      lastActiveCueIndex = idx;
      const scroll = document.getElementById('subtitleScroll');
      if (!scroll) return;
      const items = Array.from(scroll.querySelectorAll('.cue-item'));
      items.forEach((el, i) => el.classList.toggle('active', i === idx));
      
      if (autoFollow || forceScroll) {
        const activeEl = items[idx];
        if (activeEl && typeof activeEl.scrollIntoView === 'function') {
          activeEl.scrollIntoView({ 
            behavior: forceScroll ? 'instant' : 'smooth', 
            block: 'center' 
          });
        }
      }
    }

    // 优先使用当前曲目的 vtt（字符串或 URL），否则 URL 参数，再否则生成示例
    async function ensureSubtitleCues() {
      if (subtitleCues.length) return;

      const cur = playlist[index] || {};
      
      // 1) 曲目自带 vtt
      if (cur.vtt) {
        try {
          if (Array.isArray(cur.vtt)) {
            subtitleCues = cur.vtt;
            if (subtitleCues.length) return;
          } else if (typeof cur.vtt === 'string') {
            subtitleCues = parseVTT(cur.vtt);
            if (subtitleCues.length) return;
          }
        } catch {}
      }

      // 2) 无则生成示例
      let dur = 0;
      if (isInFrame && isConnectedToParent) {
        const state = fetchParentPlayerState();
        dur = state ? state.duration : 0;
      } else {
        dur = audio.duration || 0;
      }
      
      if (dur > 0) {
        const pieces = Math.min(12, Math.max(6, Math.floor(dur / 10)));
        const span = dur / pieces;
        subtitleCues = Array.from({length: pieces}).map((_, i) => ({
          start: Math.floor(i * span),
          end: Math.floor((i+1) * span - 0.2),
          text: `示例字幕第 ${i+1} 段（请提供 .vtt 以替换为真实字幕）`
        }));
      }
    }

    albumImage.addEventListener('click', (e) => {
      e.stopPropagation();
      if (!showSubtitles) enterSubtitles();  // 已在字幕模式下点击不做事
    });

    // ====== 主初始化函数 ======
    async function init() {
      console.log('播放页初始化');
      
      // 初始化迷你控制按钮（修复播放模式和倍速按钮）
      wireMiniControls();
      wireProgressBar();

      // 发送准备就绪消息给父窗口
      if (isInFrame && window.parent) {
        window.parent.postMessage({
          type: 'PLAYER_PAGE_READY'
        }, '*');
      }

      // 尝试从父窗口或URL初始化
      const success = initFromParentOrURL();
      
      if (!success) {
        console.log('使用默认播放列表');
        // 使用默认播放列表
        playlist = [
          {
            id: "song-lyrics",
            title: "SoundHelix Song 1 (Lyric Demo)",
            artist: "SoundHelix",
            src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3",
            durationText: "06:13",
            vtt: `WEBVTT

00:00:00.000 --> 00:00:06.000
夜色轻落在都市的边缘

00:00:06.000 --> 00:00:12.000
微风拂过你温柔的侧脸

00:00:12.000 --> 00:00:18.000
咖啡杯沿还残留着思念

00:00:18.000 --> 00:00:24.000
我们在人海中擦肩

00:00:24.000 --> 00:00:30.000
一段旋律慢慢浮现

00:00:30.000 --> 00:00:36.000
像是某年某天的约见

00:00:36.000 --> 00:00:42.000
你笑着说要向前

00:00:42.000 --> 00:00:48.000
别让遗憾落在今天

00:00:48.000 --> 00:00:54.000
夜色不再那么深沉

00:00:54.000 --> 00:01:00.000
心事也变得轻一些

00:01:00.000 --> 00:01:06.000
当音乐把距离拉近

00:01:06.000 --> 00:01:12.000
你和我并肩向前

00:01:12.000 --> 00:01:18.000
灯火映照着笑脸

00:01:18.000 --> 00:01:24.000
这一刻刚刚好出现`
          },
          { title: "Kalimba (Test Audio)", artist: "Ninja Tuna", cover: "", src: "https://www.learningcontainer.com/wp-content/uploads/2020/02/Kalimba.mp3", durationText: "00:30" },
          { title: "Sample MP3 (700KB)", artist: "Sample Source", cover: "", src: "https://sample.cat/downloads/file_example_MP3_700KB.mp3", durationText: "00:24" }
        ];
        index = 0;
        courseTitleEl.textContent = playlist[0].title;
        courseAuthorEl.innerHTML = `作者：${escapeHtml(playlist[0].artist)}`;
        
        if (!isInFrame) {
          // 独立模式：设置音频源并加载
          if (playlist[0].src) {
            audio.src = playlist[0].src;
            audio.load();
          }
        }
      }

      // 渲染UI
      renderChapterList();
      renderRecommendations();
      updateNowPlayingUI(index);

      // 事件监听
      playBtn && playBtn.addEventListener('click', async (e) => {
        e.stopPropagation();
        e.preventDefault();
        togglePlay();
      });
      
      prevBtn && prevBtn.addEventListener('click', (e) => { 
        e.stopPropagation(); 
        e.preventDefault();
        playPrev();
      });
      
      nextBtn && nextBtn.addEventListener('click', (e) => { 
        e.stopPropagation(); 
        e.preventDefault();
        playNext();
      });

      // 独立模式的事件监听
      if (!isInFrame) {
        console.log('设置独立模式事件监听');
        
        audio.addEventListener('timeupdate', () => {
          const dur = audio.duration || 0;
          const cur = audio.currentTime || 0;
          const pct = dur ? (cur / dur) * 100 : 0;
          progressFill.style.width = `${pct}%`;
          progressBar.setAttribute('aria-valuemax', Math.floor(dur));
          progressBar.setAttribute('aria-valuenow', Math.floor(cur));
          timeCur.textContent = formatTime(cur);
          timeTotal.textContent = formatTime(dur);
          
          if (showSubtitles) updateActiveCueByTime(cur);
        });
        
        audio.addEventListener('loadedmetadata', async () => {
          console.log('音频元数据加载完成，时长:', audio.duration);
          timeTotal.textContent = formatTime(audio.duration);
          nowDuration.textContent = `时长：${formatTime(audio.duration)}`;
          
          await ensureSubtitleCues();
          if (showSubtitles) {
            buildSubtitlePanel();
            updateActiveCueByTime(audio.currentTime || 0, true);
          }
        });
        
        audio.addEventListener('ended', onEndedHandle);
        
      } else {
        // iframe模式下的事件监听
        console.log('设置iframe模式事件监听');
        
        // 定时从父窗口获取状态更新UI
        syncInterval = setInterval(() => {
          if (isConnectedToParent) {
            const state = fetchParentPlayerState();
            if (state) {
              updateUIFromParentState(state);
            }
          }
        }, 1000);
        
        // 页面卸载时清除定时器
        window.addEventListener('beforeunload', () => {
          if (syncInterval) {
            clearInterval(syncInterval);
          }
        });
      }

      // 初始UI更新
      updatePlayButtonUI();
      updateModeUI();
      updateModeText();
      updateRateUI();
    }

    // ============ 监听来自父窗口的消息 ============
    window.addEventListener('message', function(event) {
      console.log('收到消息:', event.data);
      
      const { type, data } = event.data || {};
      
      switch (type) {
        case 'PLAYER_BAR_STATE':
          console.log('收到播放栏完整状态');
          updateConnectionStatus(true);
          updateUIFromParentState(data);
          break;
          
        case 'PLAYER_BAR_UPDATE':
          console.log('收到播放栏状态更新');
          updateConnectionStatus(true);
          updateUIFromParentState(data);
          break;
      }
    });

    // 接收父窗口播放栏状态更新
    window.updateFromPlayerBar = function(state) {
      console.log('通过updateFromPlayerBar接收状态');
      updateConnectionStatus(true);
      updateUIFromParentState(state);
    };

    // 初始化
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }

    // 暴露API
    window.PlayerPage = { 
      playlist, 
      getCurrent: () => ({ index, track: playlist[index] }), 
      setPlayMode, 
      setPlaybackRate, 
      setVolume 
    };
  })();
  </script>
</body>
</html>
