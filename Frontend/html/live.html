            <script>
            // ============ 通知主框架当前页面状态 ============
            // 第三种情况：不显示播放栏且播放暂停
            function notifyParentPage() {
                if (window.parent !== window) {
                    window.parent.postMessage({
                        type: 'PAGE_STATE',
                        data: {
                            pageName: 'live',
                            state: 'hidden-paused' // 直播间页：不显示播放栏且播放暂停
                        }
                    }, '*');
                    
                    // 在iframe中时隐藏导航栏
                    hideHeaderInIframe();
                    
                    // 控制台提示
                    console.log('已通知主框架：live（隐藏播放栏，暂停播放）');
                }
            }
            
            // 隐藏导航栏（在iframe中时）
            function hideHeaderInIframe() {
                const header = document.querySelector('header.header');
                if (header) {
                    header.style.display = 'none';
                }
                document.body.style.paddingTop = '0';
            }

            // 页面加载时通知主框架
            window.addEventListener('load', function() {
                setTimeout(notifyParentPage, 100); // 延迟确保主框架准备好
            });

            // 如果页面是通过iframe直接加载的，立即通知
            if (window.parent !== window) {
                notifyParentPage();
            }
            </script>

    <script>
        // ============ 通知主框架当前页面状态 ============
        function notifyParentPage() {
            if (window.parent !== window) {
                // 发送页面状态消息给主框架
                window.parent.postMessage({
                    type: 'PAGE_STATE',
                    data: { 
                        pageName: 'live', 
                        state: 'hidden-paused'  // 直播页：不显示且播放暂停
                    }
                }, '*');
                
                console.log('已通知主框架：直播页（不显示播放栏，暂停播放）');
            }
        }

        // 页面加载时通知主框架
        window.addEventListener('load', function() {
            setTimeout(notifyParentPage, 100); // 延迟确保主框架准备好
        });

        // 如果页面是通过iframe直接加载的，立即通知
        if (window.parent !== window) {
            notifyParentPage();
        }

        // 聊天功能
        const chatInput = document.querySelector('.chat-input');
        const chatSendBtn = document.querySelector('.chat-input-area .btn-orange');
        const chatMessages = document.getElementById('chat-messages');
        const urlParams = new URLSearchParams(window.location.search);
        const liveId = urlParams.get('id');
        const liveTitle = urlParams.get('title');
        const teacherName = urlParams.get('teacher');

        if (liveTitle) {
            document.querySelector('.live-title').textContent = liveTitle;
        }

        if (teacherName) {
            // 更新老师姓名
            const teacherElements = document.querySelectorAll('.anchor-name, .teacher-name, .user-name');
            teacherElements.forEach(el => {
                el.textContent = teacherName;
            });
        }

        // 如果有直播ID，可以用于后续获取更多直播数据
        if (liveId) {
            console.log('直播ID:', liveId);
            // 这里可以添加根据ID获取直播详细信息的代码
        }

        chatSendBtn.addEventListener('click', sendMessage);
        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        function sendMessage() {
            const message = chatInput.value.trim();
            if (message) {
                const now = new Date();
                const timeStr = `${now.getFullYear()}.${String(now.getMonth() + 1).padStart(2, '0')}.${String(now.getDate()).padStart(2, '0')} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
                
                const messageDiv = document.createElement('div');
                messageDiv.className = 'message student';
                messageDiv.innerHTML = `
                    <div class="message-sender">我</div>
                    <div class="message-content">${message}</div>
                    <div class="message-time">${timeStr}</div>
                `;
                chatMessages.appendChild(messageDiv);
                chatInput.value = '';
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }
        }
    </script>


<!-- 登录状态检查脚本 -->
<script>
    // 检查用户是否已登录
    function checkLoginStatus() {
        const authToken = localStorage.getItem('authToken');
        const authSection = document.getElementById('auth-section');
        
        if (authToken) {
            // 用户已登录，显示用户菜单
            authSection.innerHTML = `
                <div class="user-menu">
                    <button class="submit-btn" onclick="showUserMenu()">个人中心</button>
                    <div class="dropdown-menu" id="user-dropdown" style="display: none;">
                        <a href="my-profile.html" class="dropdown-item">我的资料</a>
                        <a href="#" class="dropdown-item" onclick="logout()">退出登录</a>
                    </div>
                </div>
            `;
            
            // 更新用户信息区
            const usernameElement = document.querySelector('.username');
            if (usernameElement) {
                usernameElement.textContent = '已登录用户';
            }
        }
    }
    
    // 显示用户菜单
    function showUserMenu() {
        const dropdown = document.getElementById('user-dropdown');
        dropdown.style.display = dropdown.style.display === 'none' ? 'block' : 'none';
    }
    
    // 登出功能
    function logout() {
        localStorage.removeItem('authToken');
        location.reload();
    }
    
    // 页面加载时检查登录状态
    window.addEventListener('DOMContentLoaded', checkLoginStatus);
    
    // 点击其他区域关闭下拉菜单
    document.addEventListener('click', function(event) {
        const dropdown = document.getElementById('user-dropdown');
        const userMenu = document.querySelector('.user-menu');
        
        if (dropdown && userMenu && !userMenu.contains(event.target)) {
            dropdown.style.display = 'none';
        }
    });
</script>

<style>
    .user-menu {
        position: relative;
        display: inline-block;
    }
    
    .dropdown-menu {
        position: absolute;
        top: 100%;
        right: 0;
        background-color: white;
        min-width: 150px;
        box-shadow: 0 8px 16px rgba(0,0,0,0.1);
        border-radius: 4px;
        z-index: 1000;
        margin-top: 5px;
    }
    
    .dropdown-item {
        display: block;
        padding: 10px 15px;
        color: #333;
        text-decoration: none;
        font-size: 14px;
    }
    
    .dropdown-item:hover {
        background-color: #f5f5f5;
    }
</style>
