<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <meta charset="UTF-8">
  <title>星之声 App - 英语听说练习社区</title>
  <style>
    body { margin:0; padding:0; font-family: system-ui, sans-serif; background: #f7f7f7; }
    #app-frame-wrap { width:100vw; height:calc(100vh - 96px); background:#fff;}
    #page-frame { width:100%; height:100%; border:none; }
    .nav { background:#fff8dc; border-bottom:1.5px solid #FFDAB9; padding: 0 20px;}
    .nav a {
      display:inline-block; margin:0 10px; padding:14px 8px; color:#FF8C00; font-weight:600;
      text-decoration:none; border-bottom: 2px solid transparent;
    }
    .nav a.active, .nav a:hover { border-bottom: 2px solid #FF8C00; color: #d96800;}
    body { padding-bottom:96px;}
    .pv-player-bar {
      position: fixed; left: 0; right: 0; bottom: 0;
      width: 100%; height: 96px; background: #ffffff;
      border-top: 1px solid #e0e0e0; box-shadow: 0 -4px 20px rgba(0,0,0,0.08);
      z-index: 29999; display: flex; align-items: center; user-select: none; pointer-events: auto;
    }
    .pv-player-bar.hidden { display: none; }
    .pv-inner {
      width: 100%; max-width: 1200px; margin: 0 auto;
      display: grid; grid-template-columns: auto 1fr auto; align-items: center;
      column-gap: 16px; padding: 0 24px; height: 100%;
    }
    .pv-left { display: inline-flex; align-items: center; gap: 12px; min-width: 240px; }
    .pv-cover { width: 52px; height: 52px; border-radius: 8px; background: #eee no-repeat center/cover; box-shadow: 0 2px 6px rgba(0,0,0,0.1); flex-shrink: 0; cursor: pointer; }
    .pv-meta { display: flex; flex-direction: column; min-width: 0; }
    .pv-title { font-size: 16px; font-weight: 700; color: #222; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
    .pv-artist { font-size: 12px; color: #666; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pv-center { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; min-width: 0; }
    .pv-controls { display: inline-flex; align-items: center; gap: 18px; }
    .ctrl-btn, .mode-btn, .rate-btn {
      background: transparent; border: none; cursor: pointer; color: #444;
      font-size: 18px; padding: 6px; display: inline-flex; align-items: center; justify-content: center; transition: color 0.2s;
    }
    .ctrl-btn:hover, .mode-btn:hover, .rate-btn:hover { color: #ff8c00; }
    .play-btn {
      width: 44px; height: 44px; border-radius: 50%; background: #ff8c00; color: #fff; border: none;
      display: inline-flex; align-items: center; justify-content: center; cursor: pointer;
      box-shadow: 0 4px 10px rgba(255,140,0,0.30); transition: transform 0.1s, background 0.2s;
    }
    .play-btn:hover { background: #e67e00; transform: scale(1.05); }
    .icon { width: 18px; height: 18px; fill: currentColor; }
    .pv-progress-row { display: flex; align-items: center; gap: 12px; width: 100%; }
    .time.small { font-size: 12px; color: #888; width: 48px; text-align: center; font-variant-numeric: tabular-nums; }
    .pv-progress { position: relative; flex: 1; height: 6px; background: #eee; border-radius: 3px; cursor: pointer; touch-action: none; }
    .pv-progress::before { content: ''; position: absolute; top: -10px; bottom: -10px; left: 0; right: 0; z-index: 1; }
    .pv-progress-fill { position: absolute; left: 0; top: 0; bottom: 0; background: #ff8c00; border-radius: 3px; width: 0%; pointer-events: none; }
    .pv-knob { position: absolute; top: 50%; right: -6px; transform: translateY(-50%); width: 12px; height: 12px; background: #fff; border: 2px solid #ff8c00; border-radius: 50%; box-shadow: 0 1px 4px rgba(0,0,0,0.2); opacity: 0; transition: opacity 0.2s; pointer-events: none; }
    .pv-progress:hover .pv-knob, .pv-progress.dragging .pv-knob { opacity: 1; }
    .pv-right { display: inline-flex; align-items: center; justify-content: flex-end; gap: 12px; min-width: 240px; }
    .pv-volume { width: 140px; height: 20px; display: flex; align-items: center; cursor: pointer; position: relative; }
    .pv-volume-bar { width: 100%; height: 4px; background: #eee; border-radius: 2px; position: relative; overflow: visible; pointer-events: none; }
    .pv-volume-fill { height: 100%; background: #888; width: 50%; border-radius: 2px; position: relative; }
    .pv-volume-fill::after { content: ''; position: absolute; right: -5px; top: 50%; transform: translateY(-50%); width: 10px; height: 10px; background: #fff; border: 1px solid #888; border-radius: 50%; opacity: 0; transition: opacity 0.2s; }
    .pv-volume:hover .pv-volume-fill::after { opacity: 1; }
    .popover {
      position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%);
      background: #fff; border: 1px solid #ddd; border-radius: 8px;
      box-shadow: 0 10px 24px rgba(0,0,0,0.12);
      padding: 8px; z-index: 30000; display: none;
    }
    .popover.show { display: flex; }
    .mode-popover { gap: 10px; align-items: center; }
    .mode-item {
      width: 40px; height: 40px; border-radius: 8px; border: 1px solid #eee;
      display: inline-flex; align-items: center; justify-content: center; cursor: pointer; color: #444;
    }
    .mode-item:hover { color: #ff8c00; border-color: #ffeed6; background: #fff9f0; }
    .mode-item.active { color: #fff; background: #ff8c00; border-color: #ff8c00; }
    .rate-popover { flex-direction: column; min-width: 140px; }
    .rate-item { padding: 8px 12px; font-size: 14px; color: #333; cursor: pointer; border-radius: 6px; }
    .rate-item:hover { background: #f7f7f7; }
    .rate-item.active { color: #ff8c00; font-weight: 700; background: #fff4e6; }
    .playlist-panel {
      position: fixed;
      right: 20px;
      bottom: 100px;
      width: 300px;
      max-height: 400px;
      background: white;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
      overflow-y: auto;
      z-index: 30000;
      padding: 10px 0;
      display: none;
    }
    .playlist-item {
      padding: 10px 16px;
      cursor: pointer;
      border-bottom: 1px solid #f0f0f0;
      transition: background 0.2s;
      font-size: 14px;
      color: #333;
    }
    .playlist-item:hover { background: #fff9f0; }
    .playlist-item.active { background: #fff4e6; color: #ff8c00; font-weight: 600; }
    @media (max-width: 900px) {
      .pv-left { min-width: 0; }
      .pv-right { min-width: 0; }
      .pv-inner { grid-template-columns: auto 1fr auto; column-gap: 10px; padding: 0 12px; }
      
      /* 顶部导航栏响应式 */
      .main-nav .nav-item {
        margin: 0 5px;
        padding: 14px 5px;
        font-size: 14px;
      }
      
      .search-box {
        margin-left: 10px;
      }
      
      .search-input {
        width: 150px;
      }
      
      .user-functions .func-item {
        margin-left: 5px;
        padding: 5px;
        font-size: 14px;
      }
    }
    
    @media (max-width: 768px) {
      /* 顶部导航栏响应式 */
      .header {
        flex-direction: column;
        padding: 10px;
        gap: 10px;
      }
      
      .main-nav {
        flex-wrap: wrap;
        justify-content: center;
        gap: 5px;
      }
      
      .search-box {
        width: 100%;
        margin-left: 0;
      }
      
      .search-input {
        width: 100%;
      }
      
      .user-functions {
        flex-wrap: wrap;
        justify-content: center;
        gap: 5px;
      }
      
      /* 播放栏响应式 */
      .pv-left {
        gap: 8px;
      }
      
      .pv-cover {
        width: 40px;
        height: 40px;
      }
      
      .pv-title {
        font-size: 14px;
      }
      
      .pv-artist {
        font-size: 11px;
      }
      
      .pv-controls {
        gap: 12px;
      }
      
      .play-btn {
        width: 40px;
        height: 40px;
      }
      
      .ctrl-btn, .mode-btn, .rate-btn {
        font-size: 16px;
      }
    }
    
    @media (max-width: 480px) {
      /* 顶部导航栏响应式 */
      .logo-text {
        font-size: 16px;
      }
      
      .main-nav .nav-item {
        font-size: 12px;
        padding: 8px 5px;
      }
      
      .user-functions .func-item {
        font-size: 12px;
        padding: 5px 3px;
      }
      
      /* iframe容器响应式 */
      #app-frame-wrap {
        height: calc(100vh - 140px);
      }
      
      /* 播放栏响应式 */
      .pv-inner {
        padding: 0 8px;
      }
      
      .pv-left {
        gap: 6px;
      }
      
      .pv-cover {
        width: 36px;
        height: 36px;
      }
      
      .pv-title {
        font-size: 13px;
      }
      
      .pv-artist {
        font-size: 10px;
      }
      
      .pv-controls {
        gap: 8px;
      }
      
      .play-btn {
        width: 36px;
        height: 36px;
      }
      
      .ctrl-btn, .mode-btn, .rate-btn {
        font-size: 14px;
      }
    }
  </style>
</style>

<!-- 登录广播监听与 UI 更新脚本 -->
<script>
// 登录广播增强脚本
(function(){
  // 将 auth-section 完全替换为个人中心按钮（不会遗留 test5）
  function showPersonalCenter(userInfo) {
    const place = document.getElementById('auth-section');
    const btnHtml = `<button id="logout-btn" class="submit-btn">退出登录</button>`;
    if (place) {
      place.innerHTML = btnHtml;
      const logoutBtn = document.getElementById('logout-btn');
      logoutBtn && logoutBtn.addEventListener('click', function(e){
        e.preventDefault();
        localStorage.removeItem('authToken');
        localStorage.removeItem('userInfo');
        sessionStorage.removeItem('userProfile');
        place.innerHTML = `<a href="login.html" data-page="login.html"><button class="submit-btn">登录/注册</button></a>`;
        const iframe = document.getElementById('page-frame');
        if (iframe) iframe.src = 'index.html';
      });
    } else {
      const root = document.querySelector('.user-functions') || document.body;
      if (root) {
        const btn = document.createElement('button');
        btn.id = 'logout-btn';
        btn.className = 'submit-btn';
        btn.textContent = '退出登录';
        btn.onclick = function(e){
          e.preventDefault();
          localStorage.removeItem('authToken');
          localStorage.removeItem('userInfo');
          sessionStorage.removeItem('userProfile');
          btn.outerHTML = `<a href="login.html" data-page="login.html"><button class="submit-btn">登录/注册</button></a>`;
          const iframe = document.getElementById('page-frame');
          if (iframe) iframe.src = 'index.html';
          
          // 重新初始化权限控制
          updateUIForAuthState(false);
        };
        root.appendChild(btn);
      }
    }
  
  // 显示个人功能链接
  updateUIForAuthState(true);
}

// 确保 iframe 立即加载 index.html（相对路径），如需改路径请自行替换为 '/html/index.html' 等
function ensureIframeShowsIndex() {
  const iframe = document.getElementById('page-frame') || document.querySelector('iframe');
  if (!iframe) return;
  try {
    // 如果当前 src 不是 index.html，就强制设置并触发加载
    const cur = (iframe.getAttribute('src') || '').split('?')[0];
    if (cur !== 'index.html') {
      iframe.src = 'index.html';
    } else {
      // 如果已经是 index.html，尝试 reload 子文档（若同源）
      try { iframe.contentWindow && iframe.contentWindow.location && iframe.contentWindow.location.reload(); } catch(e) {}
    }
  } catch(e){}
}

// 根据登录状态更新UI
function updateUIForAuthState(isLoggedIn) {
  const protectedLinks = document.querySelectorAll('[id^="guest-"]');
  const personalLinks = document.querySelectorAll('.user-functions .func-item');
  
  protectedLinks.forEach(link => {
    if (isLoggedIn) {
      // 登录后显示为个人功能链接
      const newLink = link.cloneNode(true);
      newLink.removeAttribute('id');
      newLink.removeAttribute('title');
      link.parentNode.replaceChild(newLink, link);
    } else {
      // 未登录时保持禁用状态
      link.style.opacity = '0.5';
      link.style.pointerEvents = 'auto'; // 允许点击但会触发权限检查
    }
  });
}

// 接收到登录广播后的统一处理
function handleAuthUpdate(payload) {
  if (!payload) return;
  try {
    // 1) 更新顶部为个人中心、移除test5
    showPersonalCenter(payload.userInfo || {});
    // 2) 立刻让 iframe 显示 index 页面
    ensureIframeShowsIndex();
  } catch (e) {
    console.error('handleAuthUpdate error', e);
  }
}

// 本地直接调用接口（如果登录在同一 window）
window.__auth_local_update = function(payload) { handleAuthUpdate(payload); };

// 监听 postMessage（login 页面会发 AUTH_UPDATE）
window.addEventListener('message', function(ev){
  if (!ev || !ev.data) return;
  var data = ev.data;
  try { if (typeof data === 'string') data = JSON.parse(data); } catch(e){}
  if (!data || data.type !== 'AUTH_UPDATE') return;
  handleAuthUpdate(data);
});

// 页面加载时检查 localStorage（防止登录已发生但没有 message）
window.addEventListener('DOMContentLoaded', function(){
  try {
    const token = localStorage.getItem('authToken');
    const userRaw = sessionStorage.getItem('userProfile') || localStorage.getItem('userInfo');
    const userInfo = userRaw ? JSON.parse(userRaw) : null;
    if (token) {
      // 小延迟确保 DOM 已就绪
      setTimeout(()=> handleAuthUpdate({ type:'AUTH_UPDATE', token, userInfo }), 50);
    } else {
      // 未登录时更新UI
      updateUIForAuthState(false);
    }
  } catch(e){}
});

// 监听 storage（跨 tab）
window.addEventListener('storage', function(e){
  if (!e) return;
  if (e.key === 'authToken' || e.key === 'userProfile' || e.key === 'userInfo') {
    try {
      const token = localStorage.getItem('authToken');
      const userRaw = sessionStorage.getItem('userProfile') || localStorage.getItem('userInfo');
      const userInfo = userRaw ? JSON.parse(userRaw) : null;
      handleAuthUpdate({ type:'AUTH_UPDATE', token, userInfo });
    } catch(err){}
  }
});
})();
</script>

  <script>
      // 顶部导航栏搜索跳转到search.html
      function jumpToSearchPage() {
        var input = document.getElementById('homeSearchInput');
        var kw = input.value.trim();
        if (kw) {
          document.getElementById('page-frame').src = 'search.html?keyword=' + encodeURIComponent(kw);
        } else {
          document.getElementById('page-frame').src = 'search.html';
        }
        input.value = '';
      }
      document.getElementById('homeSearchBtn').addEventListener('click', jumpToSearchPage);
      document.getElementById('homeSearchInput').addEventListener('keydown', function(e) {

        case 'seek':

            const seekTime = Math.max(0, Math.min(value, audio.duration));
            audio.currentTime = seekTime;
            const percent = (seekTime / audio.duration) * 100;
            progressFill.style.width = `${percent}%`;
            knobEl.style.left = `${percent}%`;
            timeCurEl.innerText = formatTime(seekTime);
            notifyPlayerPage();
          }
          break;
        case 'setVolume':
          const vol = Math.max(0, Math.min(1, value));
          audio.volume = vol;
          volFill.style.width = `${vol * 100}%`;
          updateVolIcon();
          notifyPlayerPage();
          break;
        case 'setPlaybackRate':
          audio.playbackRate = value;
          rateText.innerText = value.toFixed(1) + 'x';
          notifyPlayerPage();
          break;
        case 'setPlayMode':
          playMode = value;
          document.querySelectorAll('#mode-pop .mode-item').forEach(el => {
            el.classList.toggle('active', el.getAttribute('data-mode') === value);
          });
          notifyPlayerPage();
          break;
        case 'toggleMute':
          audio.muted = !audio.muted;
          updateVolIcon();
          notifyPlayerPage();
          break;
      }
    }

    loadTrack(currentIndex);
    updatePlayerState('visible-playing'); // 默认状态
    
    // 监听iframe加载完成
    document.getElementById('page-frame').addEventListener('load', function() {
      console.log('iframe加载完成');
    });
    
    // ============ 暴露全局API ============
    window.PlayerBar = {
      getState: () => ({
        playlist: playlist,
        currentIndex: currentIndex,
        isPlaying: isPlaying,
        currentTime: audio.currentTime,
        duration: audio.duration,
        volume: audio.volume,
        playbackRate: audio.playbackRate,
        playMode: playMode,
        muted: audio.muted,
        currentTrack: playlist[currentIndex]
      }),
      
      play: () => playTrack(),
      pause: () => pauseTrack(),
      togglePlay: () => togglePlay(),
      playIndex: (index) => {
        if (index >= 0 && index < playlist.length) {
          currentIndex = index;
          loadTrack(currentIndex);
          playTrack();
        }
      },
      prev: () => prevByMode(),
      next: () => nextByMode(),
      seek: (time) => {
        if (isFinite(time) && audio.duration > 0) {
          const seekTime = Math.max(0, Math.min(time, audio.duration));
          audio.currentTime = seekTime;
          notifyPlayerPage();
        }
      },
      setVolume: (vol) => {
        vol = Math.max(0, Math.min(1, vol));
        audio.volume = vol;
        volFill.style.width = `${vol * 100}%`;
        updateVolIcon();
        notifyPlayerPage();
      },
      setPlaybackRate: (rate) => {
        audio.playbackRate = rate;
        rateText.innerText = rate.toFixed(1) + 'x';
        notifyPlayerPage();
      },
      setPlayMode: (mode) => {
        playMode = mode;
        document.querySelectorAll('#mode-pop .mode-item').forEach(el => {
          el.classList.toggle('active', el.getAttribute('data-mode') === mode);
        });
        notifyPlayerPage();
      },
      toggleMute: () => {
        audio.muted = !audio.muted;
        updateVolIcon();
        notifyPlayerPage();
      },
      
      // 新添加的控制播放栏显示/隐藏和状态的方法
      updatePlayerState: (newState) => updatePlayerState(newState),
      getPlayerState: () => playerState
    };

    // 初始通知
    setTimeout(() => {
      notifyPlayerPage();
    }, 1000);
  })();
</script>

<script>
    // 检查用户是否已登录
    function checkLoginStatus() {
        const authToken = localStorage.getItem('authToken');
        const authSection = document.getElementById('auth-section');
        
        if (authToken) {
            // 用户已登录，显示用户菜单
            authSection.innerHTML = `
                <div class="user-menu">
                    <button class="submit-btn" onclick="showUserMenu()">个人中心</button>
                    <div class="dropdown-menu" id="user-dropdown" style="display: none;">
                        <a href="my-profile.html" class="dropdown-item">我的资料</a>
                        <a href="#" class="dropdown-item" onclick="logout()">退出登录</a>
                    </div>
                </div>
            `;
            
            // 更新用户信息区
            const usernameElement = document.querySelector('.username');
            if (usernameElement) {
                usernameElement.textContent = '已登录用户';
            }
        }
    }
    
    // 显示用户菜单
    function showUserMenu() {
        const dropdown = document.getElementById('user-dropdown');
        dropdown.style.display = dropdown.style.display === 'none' ? 'block' : 'none';
    }
    
    // 登出功能
    function logout() {
        localStorage.removeItem('authToken');
        location.reload();
    }
    
    // 页面加载时检查登录状态
    window.addEventListener('DOMContentLoaded', checkLoginStatus);
    
    // 点击其他区域关闭下拉菜单
    document.addEventListener('click', function(event) {
        const dropdown = document.getElementById('user-dropdown');
        const userMenu = document.querySelector('.user-menu');
        
        if (dropdown && userMenu && !userMenu.contains(event.target)) {
            dropdown.style.display = 'none';
        }
    });
</script>
