<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>关注/粉丝弹窗</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    html, body { margin:0; padding:0; background:transparent; height:100%; overflow:hidden; }
    .modal-root { width:100%; height:100%; display:flex; align-items:center; justify-content:center; background:transparent; }
    .following-modal { background:#fff; border-radius:14px; width:100%; height:100%; display:flex; flex-direction:column; overflow:hidden; }
    .following-modal-header { display:flex; align-items:center; justify-content:space-between; padding:18px 24px; font-size:18px; font-weight:600; color:#FF8C00; border-bottom:1px solid #FFE5C0; background:#fff; flex-shrink:0; }
    .following-modal-close { background:none; border:none; font-size:26px; color:#aaa; cursor:pointer; transition:color 0.2s; }
    .following-modal-close:hover { color:#FF8C00; }
    .following-modal-body { flex:1; overflow-y:auto; padding:18px 24px 22px 24px; background:#fff; min-height:0; }
    .following-user-item { display:flex; align-items:center; gap:14px; padding:12px 0; border-bottom:1px solid #f7f7f7; position:relative; }
    .following-user-avatar { width:44px; height:44px; border-radius:50%; background:#eee; display:flex; align-items:center; justify-content:center; font-size:22px; overflow:hidden; flex-shrink:0; text-decoration:none; }
    .following-user-info { flex:1; min-width:0; margin-right:100px; }
    .following-user-nickname { font-weight:500; color:#222; font-size:15px; cursor:pointer; text-decoration:none; }
    .following-user-bio { color:#888; font-size:13px; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .mutual-badge { background:#FFEDCC; color:#FF8C00; font-size:12px; border-radius:6px; padding:1px 7px; margin-left:6px; }
    .unfollow-btn { background:#fff3e0; color:#FF8C00; border:1px solid #FFDAB9; border-radius:8px; padding:4px 14px; font-size:13px; cursor:pointer; transition:background 0.2s; position:absolute; right:0; top:50%; transform:translateY(-50%); z-index:1; }
    .unfollow-btn:hover { background:#FFE5C0; }
    @media (max-width:500px) { .following-modal-body { padding:12px 16px 16px 16px; } .following-modal-header { padding:12px 16px; font-size:16px; } }
  </style>
</head>
<body>
  <div class="modal-root">
    <div class="following-modal" id="modalBox">
      <div class="following-modal-header">
        <span id="modalTitle">列表</span>
        <button class="following-modal-close" id="closeBtn">&times;</button>
      </div>
      <div class="following-modal-body">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;">
          <input id="searchInput" type="text" placeholder="搜索昵称/简介" style="flex:1;padding:6px 12px;border:1px solid #FFDAB9;border-radius:7px;font-size:14px;outline:none;">
          <select id="filterSelect" style="padding:6px 10px;border:1px solid #FFDAB9;border-radius:7px;font-size:14px;"></select>
        </div>
        <div id="listLoading" style="text-align:center;padding:32px 0;color:#aaa;">加载中...</div>
        <ul id="userList" style="margin:0;padding:0;list-style:none;"></ul>
      </div>
    </div>
  </div>
  <script>
    // 通过URL参数决定模式
    function getQuery(name) {
      const m = location.search.match(new RegExp('(?:[?&])'+name+'=([^&]*)'));
      return m ? decodeURIComponent(m[1]) : '';
    }
    // 同时支持 mode 和 type 参数（兼容不同页面的调用方式）
    const mode = getQuery('mode') || getQuery('type') || 'following'; // following or fans
    const modalTitle = document.getElementById('modalTitle');
    const filterSelect = document.getElementById('filterSelect');
    if(mode==='fans'){
      modalTitle.textContent = '我的粉丝';
      filterSelect.innerHTML = '<option value="all">全部</option><option value="mutual">互相关注</option><option value="single">单向粉丝</option>';
    }else{
      modalTitle.textContent = '我关注的人';
      filterSelect.innerHTML = '<option value="all">全部</option><option value="mutual">互相关注</option><option value="single">单向关注</option>';
    }
    // 假数据：优先从 sessionStorage 加载，可被弹窗内操作修改并同步回父窗口
    const STORAGE_KEY = 'fakeFollowData_v1';
    const defaultFollowing = [
      { avatar: '小A', color: '#FFB366', nickname: '小A同学', bio: '热爱英语学习，喜欢听播客。', mutual: true },
      { avatar: 'B', color: '#85C1E9', nickname: 'Bingo', bio: '播客达人，分享英语干货。', mutual: false },
      { avatar: 'C', color: '#96CEB4', nickname: 'Cathy', bio: '英语教师，热心答疑。', mutual: true }
    ];
    const defaultFans = [
      { avatar: '小A', color: '#FFB366', nickname: '小A同学', bio: '热爱英语学习，喜欢听播客。', mutual: true, followed: true },
      { avatar: 'B', color: '#85C1E9', nickname: 'Bingo', bio: '播客达人，分享英语干货。', mutual: false, followed: false },
      { avatar: 'C', color: '#96CEB4', nickname: 'Cathy', bio: '英语教师，热心答疑。', mutual: true, followed: true }
    ];
    let searchValue = '';
    let filterValue = 'all';

    function loadStore() {
      try {
        const raw = sessionStorage.getItem(STORAGE_KEY);
        if (raw) return JSON.parse(raw);
      } catch (e) {}
      const init = { followingList: defaultFollowing.slice(), fansList: defaultFans.slice() };
      init.followingCount = init.followingList.length;
      init.fansCount = init.fansList.length;
      sessionStorage.setItem(STORAGE_KEY, JSON.stringify(init));
      return init;
    }
    function saveStore(store) {
      store.followingCount = store.followingList.length;
      store.fansCount = store.fansList.length;
      try { sessionStorage.setItem(STORAGE_KEY, JSON.stringify(store)); } catch (e) {}
    }
    function notifyParentCounts(store) {
      const payload = { followingCount: store.followingCount, fansCount: store.fansCount };
      try{ window.parent.postMessage({type:'followDataUpdated', data: payload}, '*'); }catch(e){}
      try{ window.parent.postMessage(JSON.stringify({type:'followDataUpdated', data: payload}), '*'); }catch(e){}
    }
    // 当前运行时数据
    let store = loadStore();
    function renderList() {
      const listLoading = document.getElementById('listLoading');
      const userList = document.getElementById('userList');
      let data = mode==='fans' ? store.fansList : store.followingList;
      let filtered = data.filter(u => {
        if (filterValue === 'mutual' && !u.mutual) return false;
        if (filterValue === 'single' && u.mutual) return false;
        if (searchValue && !(u.nickname.includes(searchValue) || u.bio.includes(searchValue))) return false;
        return true;
      });
      listLoading.style.display = 'none';
      userList.innerHTML = filtered.length ? filtered.map((u, idx) =>
        `<li class="following-user-item">
          <a class="following-user-avatar" style="background:${u.color};text-decoration:none;" href="user-profile.html?user=${encodeURIComponent(u.nickname)}" target="_blank" title="查看主页">${u.avatar}</a>
          <div class="following-user-info">
            <a class="following-user-nickname" href="user-profile.html?user=${encodeURIComponent(u.nickname)}" target="_blank" style="text-decoration:none;color:#222;" title="查看主页">${u.nickname}</a>
            ${u.mutual ? '<span class="mutual-badge" title="互相关注">互相关注</span>' : ''}
            <div class="following-user-bio">${u.bio}</div>
          </div>
          ${mode==='fans' ?
            (u.followed ? `<button class="unfollow-btn" data-idx="${idx}" type="button">取消关注</button>` : `<button class="unfollow-btn" data-idx="${idx}" type="button" style="background:#FF8C00;color:#fff;border:1px solid #FF8C00;">回关</button>`) :
            `<button class="unfollow-btn" data-idx="${idx}" type="button">取消关注</button>`
          }
        </li>`
      ).join('') : '<div style="color:#aaa;text-align:center;padding:32px 0;">暂无结果</div>';
      // 绑定按钮
      userList.querySelectorAll('.unfollow-btn').forEach(btn => {
        btn.onclick = function() {
          const idx = parseInt(this.getAttribute('data-idx'));
          if(mode==='fans'){
            // 回关/取消关注操作：修改 store.fansList
            const item = store.fansList[idx];
            if(item){
              item.followed = !item.followed;
              item.mutual = item.followed ? true : item.mutual;
            }
          }else{
            // 取消关注：从 following 列表移除
            store.followingList.splice(idx,1);
          }
          saveStore(store);
          notifyParentCounts(store);
          renderList();
        };
      });
    }
    // 初始化时通知父页面当前计数，帮助父页面初次显示数字
    notifyParentCounts(store);
    document.getElementById('searchInput').oninput = function(){ searchValue=this.value.trim(); renderList(); };
    document.getElementById('filterSelect').onchange = function(){ filterValue=this.value; renderList(); };
    document.getElementById('closeBtn').onclick = function(){ 
      try{ window.parent.postMessage({type:'closeFollowModal'},'*'); }catch(e){}
      try{ window.parent.postMessage('close-follow-modal','*'); }catch(e){}
    };
    window.onload = renderList;
  </script>
</body>
</html>
