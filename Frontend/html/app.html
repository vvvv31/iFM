<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>星之声 App - 英语听说练习社区</title>
  <style>
    body { margin:0; padding:0; font-family: system-ui, sans-serif; background: #f7f7f7; }
    #app-frame-wrap { width:100vw; height:calc(100vh - 96px); background:#fff;}
    #page-frame { width:100%; height:100%; border:none; }
    .nav { background:#fff8dc; border-bottom:1.5px solid #FFDAB9; padding: 0 20px;}
    .nav a {
      display:inline-block; margin:0 10px; padding:14px 8px; color:#FF8C00; font-weight:600;
      text-decoration:none; border-bottom: 2px solid transparent;
    }
    .nav a.active, .nav a:hover { border-bottom: 2px solid #FF8C00; color: #d96800;}
    body { padding-bottom:96px;}
    .pv-player-bar {
      position: fixed; left: 0; right: 0; bottom: 0;
      width: 100%; height: 96px; background: #ffffff;
      border-top: 1px solid #e0e0e0; box-shadow: 0 -4px 20px rgba(0,0,0,0.08);
      z-index: 29999; display: flex; align-items: center; user-select: none; pointer-events: auto;
    }
    .pv-inner {
      width: 100%; max-width: 1200px; margin: 0 auto;
      display: grid; grid-template-columns: auto 1fr auto; align-items: center;
      column-gap: 16px; padding: 0 24px; height: 100%;
    }
    .pv-left { display: inline-flex; align-items: center; gap: 12px; min-width: 240px; }
    .pv-cover { width: 52px; height: 52px; border-radius: 8px; background: #eee no-repeat center/cover; box-shadow: 0 2px 6px rgba(0,0,0,0.1); flex-shrink: 0; cursor: pointer; }
    .pv-meta { display: flex; flex-direction: column; min-width: 0; }
    .pv-title { font-size: 16px; font-weight: 700; color: #222; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
    .pv-artist { font-size: 12px; color: #666; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pv-center { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; min-width: 0; }
    .pv-controls { display: inline-flex; align-items: center; gap: 18px; }
    .ctrl-btn, .mode-btn, .rate-btn {
      background: transparent; border: none; cursor: pointer; color: #444;
      font-size: 18px; padding: 6px; display: inline-flex; align-items: center; justify-content: center; transition: color 0.2s;
    }
    .ctrl-btn:hover, .mode-btn:hover, .rate-btn:hover { color: #ff8c00; }
    .play-btn {
      width: 44px; height: 44px; border-radius: 50%; background: #ff8c00; color: #fff; border: none;
      display: inline-flex; align-items: center; justify-content: center; cursor: pointer;
      box-shadow: 0 4px 10px rgba(255,140,0,0.30); transition: transform 0.1s, background 0.2s;
    }
    .play-btn:hover { background: #e67e00; transform: scale(1.05); }
    .icon { width: 18px; height: 18px; fill: currentColor; }
    .pv-progress-row { display: flex; align-items: center; gap: 12px; width: 100%; }
    .time.small { font-size: 12px; color: #888; width: 48px; text-align: center; font-variant-numeric: tabular-nums; }
    .pv-progress { position: relative; flex: 1; height: 6px; background: #eee; border-radius: 3px; cursor: pointer; touch-action: none; }
    .pv-progress::before { content: ''; position: absolute; top: -10px; bottom: -10px; left: 0; right: 0; z-index: 1; }
    .pv-progress-fill { position: absolute; left: 0; top: 0; bottom: 0; background: #ff8c00; border-radius: 3px; width: 0%; pointer-events: none; }
    .pv-knob { position: absolute; top: 50%; right: -6px; transform: translateY(-50%); width: 12px; height: 12px; background: #fff; border: 2px solid #ff8c00; border-radius: 50%; box-shadow: 0 1px 4px rgba(0,0,0,0.2); opacity: 0; transition: opacity 0.2s; pointer-events: none; }
    .pv-progress:hover .pv-knob, .pv-progress.dragging .pv-knob { opacity: 1; }
    .pv-right { display: inline-flex; align-items: center; justify-content: flex-end; gap: 12px; min-width: 240px; }
    .pv-volume { width: 140px; height: 20px; display: flex; align-items: center; cursor: pointer; position: relative; }
    .pv-volume-bar { width: 100%; height: 4px; background: #eee; border-radius: 2px; position: relative; overflow: visible; pointer-events: none; }
    .pv-volume-fill { height: 100%; background: #888; width: 50%; border-radius: 2px; position: relative; }
    .pv-volume-fill::after { content: ''; position: absolute; right: -5px; top: 50%; transform: translateY(-50%); width: 10px; height: 10px; background: #fff; border: 1px solid #888; border-radius: 50%; opacity: 0; transition: opacity 0.2s; }
    .pv-volume:hover .pv-volume-fill::after { opacity: 1; }
    .popover {
      position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%);
      background: #fff; border: 1px solid #ddd; border-radius: 8px;
      box-shadow: 0 10px 24px rgba(0,0,0,0.12);
      padding: 8px; z-index: 30000; display: none;
    }
    .popover.show { display: flex; }
    .mode-popover { gap: 10px; align-items: center; }
    .mode-item {
      width: 40px; height: 40px; border-radius: 8px; border: 1px solid #eee;
      display: inline-flex; align-items: center; justify-content: center; cursor: pointer; color: #444;
    }
    .mode-item:hover { color: #ff8c00; border-color: #ffeed6; background: #fff9f0; }
    .mode-item.active { color: #fff; background: #ff8c00; border-color: #ff8c00; }
    .rate-popover { flex-direction: column; min-width: 140px; }
    .rate-item { padding: 8px 12px; font-size: 14px; color: #333; cursor: pointer; border-radius: 6px; }
    .rate-item:hover { background: #f7f7f7; }
    .rate-item.active { color: #ff8c00; font-weight: 700; background: #fff4e6; }
    .playlist-panel {
      position: fixed;
      right: 20px;
      bottom: 100px;
      width: 300px;
      max-height: 400px;
      background: white;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
      overflow-y: auto;
      z-index: 30000;
      padding: 10px 0;
      display: none;
    }
    .playlist-item {
      padding: 10px 16px;
      cursor: pointer;
      border-bottom: 1px solid #f0f0f0;
      transition: background 0.2s;
      font-size: 14px;
      color: #333;
    }
    .playlist-item:hover { background: #fff9f0; }
    .playlist-item.active { background: #fff4e6; color: #ff8c00; font-weight: 600; }
    @media (max-width: 900px) {
      .pv-left { min-width: 0; }
      .pv-right { min-width: 0; }
      .pv-inner { grid-template-columns: auto 1fr auto; column-gap: 10px; padding: 0 12px; }
    }
  </style>
</head>
<body>
  <!-- 导航栏 -->
  <div class="nav">
    <a href="#" data-page="index.html" class="active">首页</a>
    <a href="#" data-page="category.html">分类</a>
    <a href="#" data-page="channel.html">社区</a>
    <a href="#" data-page="player.html">播放器</a>
  </div>
  
  <!-- 内容区（iframe框） -->
  <div id="app-frame-wrap" style="width:100vw;height:calc(100vh - 96px);">
    <iframe id="page-frame" src="index.html"></iframe>
  </div>
  
  <!-- 播放栏 -->
  <aside id="pv-player" class="pv-player-bar">
    <div class="pv-inner">
      <div class="pv-left">
        <div id="pv-cover" class="pv-cover" role="button" tabindex="0" aria-label="打开播放页面"></div>
        <div class="pv-meta">
          <div id="pv-title" class="pv-title" role="button" tabindex="0">SoundHelix Song 1 (Lyric Demo)</div>
          <div id="pv-artist" class="pv-artist">SoundHelix</div>
        </div>
      </div>
      <div class="pv-center">
        <div class="pv-controls">
          <button id="pv-prev" class="ctrl-btn" title="上一首" aria-label="上一首">
            <svg class="icon" viewBox="0 0 24 24"><path d="M6 6h2v12H6V6zm3.5 6l8.5 6V6l-8.5 6z"/></svg>
          </button>
          <button id="pv-play" class="play-btn" title="播放/暂停" aria-label="播放/暂停">
            <svg id="play-icon" class="icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          </button>
          <button id="pv-next" class="ctrl-btn" title="下一首" aria-label="下一首">
            <svg class="icon" viewBox="0 0 24 24"><path d="M16 6h2v12h-2V6zM6 18l8.5-6L6 6v12z"/></svg>
          </button>
          <div style="position: relative;">
            <button id="pv-mode-btn" class="mode-btn" title="播放模式" aria-label="播放模式">
              <svg class="icon" viewBox="0 0 24 24"><path d="M7 7h8v3l4-4-4-4v3H5v6h2V7zm10 10H9v-3l-4 4 4 4v-3h10v-6h-2v4z"/></svg>
            </button>
            <div id="mode-pop" class="popover mode-popover">
              <div class="mode-item active" data-mode="single" title="单曲循环">
                <svg class="icon" viewBox="0 0 24 24"><path d="M12 5v4l-1.5-1.5C8 10 8 14 10.5 16.5S16 19 18.5 16.5L20 18c-3 3-8 3-11 0S6 9 9 6L12 5z"/></svg>
              </div>
              <div class="mode-item" data-mode="list" title="歌单顺序循环">
                <svg class="icon" viewBox="0 0 24 24"><path d="M4 6h12v2H4V6zm0 5h12v2H4v-2zm0 5h8v2H4v-2zm15-7l-3 3h2v4h2v-4h2l-3-3z"/></svg>
              </div>
              <div class="mode-item" data-mode="shuffle" title="歌单乱序循环">
                <svg class="icon" viewBox="0 0 24 24"><path d="M16 3h5v5h-2V6.41l-4.29 4.3-1.42-1.42L17.59 5H16V3zM4 6h7l2 2H4V6zm0 6h5l2 2H4v-2zm12 3h1.59l-2.29 2.29 1.42 1.42L20 17.41V19h2v-5h-5v2z"/></svg>
              </div>
            </div>
          </div>
          <div class="rate-control" style="position: relative;">
            <button id="pv-rate-btn" class="rate-btn" title="倍速"><span id="rate-text" style="font-size: 12px; font-weight: bold;">1x</span></button>
            <div id="rate-pop" class="popover rate-popover">
              <div class="rate-item" data-rate="0.5">0.5x</div>
              <div class="rate-item active" data-rate="1">1.0x</div>
              <div class="rate-item" data-rate="1.5">1.5x</div>
              <div class="rate-item" data-rate="2">2.0x</div>
            </div>
          </div>
        </div>
        <div class="pv-progress-row">
          <span id="pv-time-cur" class="time small">00:00</span>
          <div id="pv-progress" class="pv-progress">
            <div id="pv-progress-fill" class="pv-progress-fill"></div>
            <div id="pv-knob" class="pv-knob"></div>
          </div>
          <span id="pv-time-total" class="time small">00:00</span>
        </div>
      </div>
      <div class="pv-right">
        <button id="pv-mute" class="ctrl-btn" title="静音/取消静音" aria-label="静音">
          <svg id="vol-icon" class="icon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3z"/></svg>
        </button>
        <div id="pv-volume" class="pv-volume">
          <div class="pv-volume-bar"><div id="pv-volume-fill" class="pv-volume-fill"></div></div>
        </div>
        <button id="pv-list-btn" class="ctrl-btn" title="播放列表" aria-label="播放列表">
          <svg class="icon" viewBox="0 0 24 24"><path d="M3 5h18v2H3V5zm0 6h12v2H3v-2zm0 6h8v2H3v-2z"/></svg>
        </button>
      </div>
    </div>
    <div id="playlist-panel" class="playlist-panel">
      <div class="playlist-item active" onclick="playIndex(0)">1. SoundHelix Song 1 (Lyric Demo)</div>
      <div class="playlist-item" onclick="playIndex(1)">2. Kalimba (Test Audio)</div>
      <div class="playlist-item" onclick="playIndex(2)">3. Sample MP3 (700KB)</div>
    </div>
    <audio id="pv-audio" preload="metadata"></audio>
  </aside>
  
  <script>
  // 框架跳转控制脚本
  document.querySelectorAll('.nav a').forEach(el => {
    el.onclick = function(e){
      e.preventDefault();
      document.getElementById('page-frame').src = this.getAttribute('data-page');
      document.querySelectorAll('.nav a').forEach(a => a.classList.remove('active'));
      this.classList.add('active');
    }
  });

  // 播放栏主控制
  ;(function () {
    const playlist = [
      {
        id: "song-lyrics",
        title: "SoundHelix Song 1 (Lyric Demo)",
        artist: "SoundHelix",
        cover: "",
        src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3",
        durationText: "06:13",
        vtt: `WEBVTT

00:00:00.000 --> 00:00:06.000
夜色轻落在都市的边缘

00:00:06.000 --> 00:00:12.000
微风拂过你温柔的侧脸

00:00:12.000 --> 00:00:18.000
咖啡杯沿还残留着思念

00:00:18.000 --> 00:00:24.000
我们在人海中擦肩

00:00:24.000 --> 00:00:30.000
一段旋律慢慢浮现

00:00:30.000 --> 00:00:36.000
像是某年某天的约见

00:00:36.000 --> 00:00:42.000
你笑着说要向前

00:00:42.000 --> 00:00:48.000
别让遗憾落在今天

00:00:48.000 --> 00:00:54.000
夜色不再那么深沉

00:00:54.000 --> 00:01:00.000
心事也变得轻一些

00:01:00.000 --> 00:01:06.000
当音乐把距离拉近

00:01:06.000 --> 00:01:12.000
你和我并肩向前

00:01:12.000 --> 00:01:18.000
灯火映照着笑脸

00:01:18.000 --> 00:01:24.000
这一刻刚刚好出现`
      },
      { 
        id: "kalimba",
        title: "Kalimba (Test Audio)", 
        artist: "Ninja Tuna", 
        cover: "", 
        src: "https://www.learningcontainer.com/wp-content/uploads/2020/02/Kalimba.mp3",
        durationText: "00:30"
      },
      { 
        id: "sample-mp3",
        title: "Sample MP3 (700KB)", 
        artist: "Sample Source", 
        cover: "", 
        src: "https://sample.cat/downloads/file_example_MP3_700KB.mp3",
        durationText: "00:24"
      }
    ];

    let currentIndex = 0;
    let isPlaying = false;
    let isDraggingProgress = false;
    let isDraggingVolume = false;
    let playMode = 'list';
    let lastSyncTime = 0; // 添加同步时间记录

    const audio = document.getElementById('pv-audio');
    const playBtn = document.getElementById('pv-play');
    const playIcon = document.getElementById('play-icon');
    const prevBtn = document.getElementById('pv-prev');
    const nextBtn = document.getElementById('pv-next');
    const titleEl = document.getElementById('pv-title');
    const artistEl = document.getElementById('pv-artist');
    const coverEl = document.getElementById('pv-cover');
    const progressEl = document.getElementById('pv-progress');
    const progressFill = document.getElementById('pv-progress-fill');
    const knobEl = document.getElementById('pv-knob');
    const timeCurEl = document.getElementById('pv-time-cur');
    const timeTotalEl = document.getElementById('pv-time-total');
    const volEl = document.getElementById('pv-volume');
    const volFill = document.getElementById('pv-volume-fill');
    const listBtn = document.getElementById('pv-list-btn');
    const playlistPanel = document.getElementById('playlist-panel');
    const rateBtn = document.getElementById('pv-rate-btn');
    const rateText = document.getElementById('rate-text');
    const muteBtn = document.getElementById('pv-mute');
    const volIcon = document.getElementById('vol-icon');
    const modeBtn = document.getElementById('pv-mode-btn');
    const modePop = document.getElementById('mode-pop');
    const ratePop = document.getElementById('rate-pop');

    // ============ 跳转到播放页 ============
    function jumpToPlayerPage() {
      console.log('跳转到播放页');
      
      // 构建URL参数
      const state = {
        playlist: playlist,
        currentIndex: currentIndex,
        isPlaying: isPlaying,
        currentTime: audio.currentTime || 0,
        duration: audio.duration || 0,
        volume: audio.volume,
        playbackRate: audio.playbackRate,
        playMode: playMode,
        muted: audio.muted
      };
      
      // 编码状态为base64，避免URL太长
      const encodedState = btoa(encodeURIComponent(JSON.stringify(state)));
      
      // 设置iframe的src为player.html，并传递状态
      document.getElementById('page-frame').src = `player.html?state=${encodedState}`;
      
      // 更新导航栏激活状态
      document.querySelectorAll('.nav a').forEach(a => a.classList.remove('active'));
      document.querySelector('.nav a[data-page="player.html"]').classList.add('active');
    }

    // 点击封面跳转到播放页
    coverEl.addEventListener('click', jumpToPlayerPage);
    // 点击标题跳转到播放页
    titleEl.addEventListener('click', jumpToPlayerPage);

    // ============ 通知播放页的函数 ============
    function notifyPlayerPage() {
      const iframe = document.getElementById('page-frame');
      if (iframe && iframe.contentWindow) {
        try {
          // 构建完整的播放状态
          const state = {
            playlist: playlist,
            currentIndex: currentIndex,
            isPlaying: isPlaying,
            currentTime: audio.currentTime || 0,
            duration: audio.duration || 0,
            volume: audio.volume,
            playbackRate: audio.playbackRate,
            playMode: playMode,
            muted: audio.muted,
            currentTrack: playlist[currentIndex]
          };
          
          // 使用postMessage发送状态
          iframe.contentWindow.postMessage({
            type: 'PLAYER_BAR_STATE',
            data: state
          }, '*');
          
          console.log('发送状态到播放页:', state);
        } catch (e) {
          console.log('通知播放页失败:', e);
        }
      }
    }

    // ============ 监听来自播放页的消息 ============
    window.addEventListener('message', function(event) {
      // 检查消息是否来自我们的iframe
      const iframe = document.getElementById('page-frame');
      if (iframe && event.source !== iframe.contentWindow) {
        return;
      }
      
      const { type, data } = event.data || {};
      console.log('收到来自播放页的消息:', type, data);
      
      switch (type) {
        case 'PLAYER_PAGE_READY':
          console.log('播放页已准备就绪，发送当前状态');
          notifyPlayerPage();
          break;
          
        case 'CONTROL_REQUEST':
          handleControlRequest(data);
          break;
          
        case 'GET_STATE_REQUEST':
          console.log('收到状态请求，发送当前状态');
          notifyPlayerPage();
          break;
      }
    });

    // 处理控制请求 - 修复seek处理逻辑
    function handleControlRequest(control) {
      const { action, value } = control || {};
      console.log('处理控制请求:', action, value);
      
      switch (action) {
        case 'play':
          playTrack();
          break;
        case 'pause':
          pauseTrack();
          break;
        case 'togglePlay':
          togglePlay();
          break;
        case 'prev':
          prevByMode();
          break;
        case 'next':
          nextByMode();
          break;
        case 'playIndex':
          if (value >= 0 && value < playlist.length) {
            currentIndex = value;
            loadTrack(currentIndex);
            playTrack();
          }
          break;
        case 'seek':
          if (isFinite(value) && audio.duration > 0) {
            // 确保跳转时间在有效范围内
            const seekTime = Math.max(0, Math.min(value, audio.duration));
            audio.currentTime = seekTime;
            // 立即更新UI
            const percent = (seekTime / audio.duration) * 100;
            progressFill.style.width = `${percent}%`;
            knobEl.style.left = `${percent}%`;
            timeCurEl.innerText = formatTime(seekTime);
            notifyPlayerPage();
          }
          break;
        case 'setVolume':
          const vol = Math.max(0, Math.min(1, value));
          audio.volume = vol;
          volFill.style.width = `${vol * 100}%`;
          updateVolIcon();
          notifyPlayerPage();
          break;
        case 'setPlaybackRate':
          audio.playbackRate = value;
          rateText.innerText = value.toFixed(1) + 'x';
          notifyPlayerPage();
          break;
        case 'setPlayMode':
          playMode = value;
          document.querySelectorAll('#mode-pop .mode-item').forEach(el => {
            el.classList.toggle('active', el.getAttribute('data-mode') === value);
          });
          notifyPlayerPage();
          break;
        case 'toggleMute':
          audio.muted = !audio.muted;
          updateVolIcon();
          notifyPlayerPage();
          break;
      }
    }

    // ============ 播放控制函数 ============
    function loadTrack(index) {
      const track = playlist[index];
      titleEl.innerText = track.title;
      artistEl.innerText = track.artist;
      coverEl.style.backgroundImage = track.cover ? `url('${track.cover}')` : '';
      audio.src = track.src;
      document.querySelectorAll('.playlist-item').forEach((item, i) => item.classList.toggle('active', i === index));
      currentIndex = index;
      
      // 通知播放页
      notifyPlayerPage();
    }
    
    function playTrack() { 
      audio.play().then(() => { 
        isPlaying = true; 
        updatePlayIcon();
        notifyPlayerPage();
      }).catch(err => {}); 
    }
    
    function pauseTrack() { 
      audio.pause(); 
      isPlaying = false; 
      updatePlayIcon();
      notifyPlayerPage();
    }
    
    function togglePlay() { isPlaying ? pauseTrack() : playTrack(); }
    
    function updatePlayIcon() {
      if (isPlaying) { 
        playIcon.setAttribute('viewBox','0 0 24 24'); 
        playIcon.innerHTML = '<path d="M6 5h4v14H6V5zm8 0h4v14h-4V5z"/>'; 
      } else { 
        playIcon.setAttribute('viewBox','0 0 24 24'); 
        playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>'; 
      }
    }
    
    function formatTime(s) { 
      if (!s || isNaN(s)) return "00:00"; 
      const m = Math.floor(s/60), ss = Math.floor(s%60); 
      return `${m<10?'0':''}${m}:${ss<10?'0':''}${ss}`; 
    }
    
    function updateVolIcon() {
      if (audio.muted || audio.volume === 0) { 
        volIcon.innerHTML = '<path d="M3 9v6h4l5 5V4L7 9H3zM14 3l7 7-1.4 1.4L16 7.8V16h-2V8.6L9.4 4 11 2.4 14 3z"/>'; 
      } else if (audio.volume < 0.5) { 
        volIcon.innerHTML = '<path d="M3 9v6h4l5 5V4L7 9H3zM14 9v6c1.7-0.7 3-2.4 3-4.5S15.7 9.7 14 9z"/>'; 
      } else { 
        volIcon.innerHTML = '<path d="M3 9v6h4l5 5V4L7 9H3zM14 7v10c3-1 5-3.6 5-7s-2-6-5-7z"/>'; 
      }
    }
    
    function stopWrap(handler) { return function(e){ e.stopPropagation(); handler(e); }; }

    // ============ 事件监听 ============
    playBtn.addEventListener('click', stopWrap(togglePlay));
    prevBtn.addEventListener('click', stopWrap(() => prevByMode()));
    nextBtn.addEventListener('click', stopWrap(() => nextByMode()));
    
    muteBtn.addEventListener('click', stopWrap(() => {
      audio.muted = !audio.muted;
      updateVolIcon();
      notifyPlayerPage();
    }));

    modeBtn.addEventListener('click', stopWrap(() => {
      ratePop.classList.remove('show');
      modePop.classList.toggle('show');
    }));
    
    modePop.addEventListener('click', stopWrap((e) => {
      const item = e.target.closest('.mode-item');
      if (!item) return;
      playMode = item.getAttribute('data-mode');
      document.querySelectorAll('#mode-pop .mode-item').forEach(el => el.classList.toggle('active', el === item));
      modePop.classList.remove('show');
      notifyPlayerPage();
    }));

    rateBtn.addEventListener('click', stopWrap(() => {
      modePop.classList.remove('show');
      ratePop.classList.toggle('show');
    }));
    
    ratePop.addEventListener('click', stopWrap((e) => {
      const item = e.target.closest('.rate-item');
      if (!item) return;
      const r = parseFloat(item.getAttribute('data-rate'));
      audio.playbackRate = r;
      rateText.innerText = r.toFixed(1) + 'x';
      document.querySelectorAll('#rate-pop .rate-item').forEach(el => el.classList.toggle('active', el === item));
      ratePop.classList.remove('show');
      notifyPlayerPage();
    }));

    document.addEventListener('click', (e) => {
      if (!modeBtn.contains(e.target) && !modePop.contains(e.target)) modePop.classList.remove('show');
      if (!rateBtn.contains(e.target) && !ratePop.contains(e.target)) ratePop.classList.remove('show');
    });

    // ============ 音频事件监听 ============
    audio.addEventListener('play', notifyPlayerPage);
    audio.addEventListener('pause', notifyPlayerPage);
    audio.addEventListener('timeupdate', () => {
      if (isDraggingProgress) return;
      const percent = (audio.currentTime / audio.duration) * 100;
      progressFill.style.width = `${percent}%`;
      knobEl.style.left = `${percent}%`;
      timeCurEl.innerText = formatTime(audio.currentTime);
      
      // 实时同步到播放页（每500ms同步一次）
      if (Date.now() - lastSyncTime > 500) {
        notifyPlayerPage();
        lastSyncTime = Date.now();
      }
    });
    audio.addEventListener('volumechange', notifyPlayerPage);
    audio.addEventListener('ratechange', notifyPlayerPage);
    audio.addEventListener('ended', () => {
      if (playMode === 'single') { 
        audio.currentTime = 0; 
        playTrack(); 
      } else { 
        nextByMode(); 
      }
      notifyPlayerPage();
    });
    audio.addEventListener('loadedmetadata', () => { 
      timeTotalEl.innerText = formatTime(audio.duration); 
      notifyPlayerPage();
    });
    
    // ============ 播放模式函数 ============
    function prevByMode() {
      if (playMode === 'shuffle') {
        currentIndex = Math.floor(Math.random() * playlist.length);
      } else {
        currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
      }
      loadTrack(currentIndex); 
      playTrack();
    }
    
    function nextByMode() {
      if (playMode === 'shuffle') {
        currentIndex = Math.floor(Math.random() * playlist.length);
      } else {
        currentIndex = (currentIndex + 1) % playlist.length;
      }
      loadTrack(currentIndex); 
      playTrack();
    }
    
    // ============ 进度条控制 ============
    function handleProgressInput(clientX) {
      const rect = progressEl.getBoundingClientRect();
      let x = clientX - rect.left; 
      x = Math.max(0, Math.min(x, rect.width));
      const pct = (x / rect.width) * 100; 
      progressFill.style.width = `${pct}%`; 
      knobEl.style.left = `${pct}%`;
      return (x / rect.width) * audio.duration;
    }
    
    progressEl.addEventListener('mousedown', stopWrap((e) => { 
      isDraggingProgress = true; 
      progressEl.classList.add('dragging'); 
      const t = handleProgressInput(e.clientX); 
      timeCurEl.innerText = formatTime(t); 
    }));
    
    document.addEventListener('mousemove', (e) => { 
      if (isDraggingProgress) { 
        e.preventDefault(); 
        const t = handleProgressInput(e.clientX); 
        timeCurEl.innerText = formatTime(t); 
      } 
    });
    
    document.addEventListener('mouseup', (e) => { 
      if (isDraggingProgress) { 
        isDraggingProgress = false; 
        progressEl.classList.remove('dragging'); 
        const t = handleProgressInput(e.clientX); 
        if (isFinite(t)) {
          audio.currentTime = t;
          notifyPlayerPage();
        }
      } 
    });

    // ============ 音量控制 ============
    function handleVolumeInput(clientX) {
      const rect = volEl.getBoundingClientRect();
      let x = clientX - rect.left; 
      x = Math.max(0, Math.min(x, rect.width));
      const p = x / rect.width; 
      volFill.style.width = `${p * 100}%`; 
      audio.volume = p;
      updateVolIcon();
      notifyPlayerPage();
    }
    
    volEl.addEventListener('mousedown', stopWrap((e) => { 
      isDraggingVolume = true; 
      handleVolumeInput(e.clientX); 
    }));
    
    document.addEventListener('mousemove', (e) => { 
      if (isDraggingVolume) { 
        e.preventDefault(); 
        handleVolumeInput(e.clientX); 
      } 
    });
    
    document.addEventListener('mouseup', () => { 
      isDraggingVolume = false; 
    });

    // ============ 播放列表控制 ============
    listBtn.addEventListener('click', stopWrap(() => {
      playlistPanel.style.display = playlistPanel.style.display === 'block' ? 'none' : 'block';
    }));
    
    window.playIndex = function(index){ 
      currentIndex = index; 
      loadTrack(currentIndex); 
      playTrack(); 
    }
    
    // ============ 初始化 ============
    loadTrack(currentIndex);
    
    // 监听iframe加载完成
    document.getElementById('page-frame').addEventListener('load', function() {
      console.log('iframe加载完成，发送状态到播放页');
      // 延迟发送状态，确保播放页脚本已执行
      setTimeout(notifyPlayerPage, 100);
    });
    
    // ============ 暴露全局API供播放页调用 ============
    window.PlayerBar = {
      // 获取当前状态
      getState: () => ({
        playlist: playlist,
        currentIndex: currentIndex,
        isPlaying: isPlaying,
        currentTime: audio.currentTime,
        duration: audio.duration,
        volume: audio.volume,
        playbackRate: audio.playbackRate,
        playMode: playMode,
        muted: audio.muted,
        currentTrack: playlist[currentIndex]
      }),
      
      // 控制方法
      play: () => playTrack(),
      pause: () => pauseTrack(),
      togglePlay: () => togglePlay(),
      playIndex: (index) => {
        if (index >= 0 && index < playlist.length) {
          currentIndex = index;
          loadTrack(currentIndex);
          playTrack();
        }
      },
      prev: () => prevByMode(),
      next: () => nextByMode(),
      seek: (time) => {
        if (isFinite(time) && audio.duration > 0) {
          const seekTime = Math.max(0, Math.min(time, audio.duration));
          audio.currentTime = seekTime;
          notifyPlayerPage();
        }
      },
      setVolume: (vol) => {
        vol = Math.max(0, Math.min(1, vol));
        audio.volume = vol;
        volFill.style.width = `${vol * 100}%`;
        updateVolIcon();
        notifyPlayerPage();
      },
      setPlaybackRate: (rate) => {
        audio.playbackRate = rate;
        rateText.innerText = rate.toFixed(1) + 'x';
        notifyPlayerPage();
      },
      setPlayMode: (mode) => {
        playMode = mode;
        document.querySelectorAll('#mode-pop .mode-item').forEach(el => {
          el.classList.toggle('active', el.getAttribute('data-mode') === mode);
        });
        notifyPlayerPage();
      },
      toggleMute: () => {
        audio.muted = !audio.muted;
        updateVolIcon();
        notifyPlayerPage();
      }
    };

    // 初始通知一次
    setTimeout(() => {
      notifyPlayerPage();
    }, 1000);
  })();
  </script>
</body>
</html>
