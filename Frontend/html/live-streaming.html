<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>直播中 - 星之声</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="../js/search.js"></script>
    <style>
        /* 直播页特定样式 - 现代化优化版 */
        body {
            background: linear-gradient(135deg, #fff9f0 0%, #fff5e6 100%);
        }
        
        .main-content {
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            max-width: 1400px;
            margin: 0 auto;
        }
        
        /* 直播主区域 */
        .live-header {
            background: linear-gradient(145deg, #ffffff 0%, #fff8f0 100%);
            border: none;
            border-radius: 20px;
            padding: 32px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(255, 140, 0, 0.12);
            position: relative;
            overflow: hidden;
        }
        
        .live-header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #FF8C00, #FFB347, #FF8C00);
            background-size: 200% 100%;
            animation: shimmer 2s infinite;
        }
        
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        
        .live-status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, #FF6B00 0%, #FF8C00 100%);
            color: white;
            padding: 10px 24px;
            border-radius: 24px;
            font-size: 14px;
            margin-bottom: 20px;
            font-weight: 600;
            box-shadow: 0 4px 16px rgba(255, 107, 0, 0.35);
            animation: pulse 2s infinite;
        }
        
        .live-status::before {
            content: '';
            width: 10px;
            height: 10px;
            background: #fff;
            border-radius: 50%;
            animation: blink 1s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }
        
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .live-status.pk {
            background: linear-gradient(135deg, #6a52e0 0%, #7b61ff 100%);
            box-shadow: 0 4px 16px rgba(123, 97, 255, 0.35);
        }
        
        .live-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 24px;
            color: #333;
            letter-spacing: 0.5px;
        }
        
        .host-info {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin-bottom: 28px;
        }
        
        .avatar {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: linear-gradient(135deg, #FF8C00 0%, #FFB347 100%);
            border: 4px solid #fff;
            box-shadow: 0 4px 20px rgba(255, 140, 0, 0.3);
            transition: transform 0.3s ease;
        }
        
        .avatar:hover {
            transform: scale(1.05);
        }
        
        .host-name {
            font-weight: 700;
            font-size: 18px;
            color: #333;
        }
        
        /* 学生列表 */
        .students-list {
            display: flex;
            gap: 28px;
            justify-content: center;
            margin-top: 28px;
            flex-wrap: wrap;
        }
        
        .student-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            transition: transform 0.3s ease;
        }
        
        .student-item:hover {
            transform: translateY(-4px);
        }
        
        .student-avatar {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: linear-gradient(135deg, #E0F7FA 0%, #B2EBF2 100%);
            border: 3px solid #4a90e2;
            box-shadow: 0 4px 16px rgba(74, 144, 226, 0.2);
            transition: all 0.3s ease;
        }
        
        .student-avatar:hover {
            box-shadow: 0 6px 24px rgba(74, 144, 226, 0.35);
        }
        
        .student-avatar.live {
            border-color: #ff4d4d;
            position: relative;
            animation: livePulse 2s infinite;
        }
        
        @keyframes livePulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255, 77, 77, 0.4); }
            50% { box-shadow: 0 0 0 8px rgba(255, 77, 77, 0); }
        }
        
        .student-avatar.live::after {
            content: '';
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 16px;
            height: 16px;
            background: linear-gradient(135deg, #ff4d4d, #ff6b6b);
            border-radius: 50%;
            border: 3px solid white;
            box-shadow: 0 2px 8px rgba(255, 77, 77, 0.4);
        }
        
        .student-name {
            font-size: 14px;
            font-weight: 600;
            color: #555;
        }
        
        /* 聊天区域 */
        .chat-container {
            background: #ffffff;
            border: none;
            border-radius: 20px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            height: 420px;
            box-shadow: 0 8px 32px rgba(255, 140, 0, 0.08);
        }
        
        .chat-header {
            font-weight: 700;
            font-size: 18px;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 2px solid #FFE5C0;
            color: #FF8C00;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .chat-header::before {
            content: '💬';
            font-size: 20px;
        }
        
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 20px;
            padding-right: 8px;
        }
        
        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }
        
        .chat-messages::-webkit-scrollbar-track {
            background: #f5f5f5;
            border-radius: 3px;
        }
        
        .chat-messages::-webkit-scrollbar-thumb {
            background: #FFD4A8;
            border-radius: 3px;
        }
        
        .chat-messages::-webkit-scrollbar-thumb:hover {
            background: #FF8C00;
        }
        
        .message {
            margin-bottom: 16px;
            padding: 14px 18px;
            border-radius: 16px;
            background-color: #f8f9fa;
            border: none;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            transition: transform 0.2s ease;
        }
        
        .message:hover {
            transform: translateX(4px);
        }
        
        .message.host {
            background: linear-gradient(135deg, #FFF5E6 0%, #FFEDD5 100%);
            border-left: 4px solid #FF8C00;
        }
        
        .message.student {
            background: linear-gradient(135deg, #EBF5FF 0%, #E1F0FF 100%);
            border-left: 4px solid #4a90e2;
        }
        
        .message.system {
            background: linear-gradient(135deg, #E8F5E9 0%, #C8E6C9 100%);
            border-left: 4px solid #4cd964;
        }
        
        .message-sender {
            font-weight: 700;
            margin-bottom: 8px;
            font-size: 14px;
            color: #333;
        }
        
        .message-content {
            margin-bottom: 8px;
            font-size: 15px;
            line-height: 1.5;
            color: #444;
        }
        
        .message-time {
            font-size: 12px;
            color: #999;
            text-align: right;
        }
        
        .chat-input {
            display: flex;
            gap: 12px;
        }
        
        .chat-input input {
            flex: 1;
            padding: 14px 18px;
            border: 2px solid #FFE5C0;
            border-radius: 12px;
            outline: none;
            font-size: 15px;
            transition: all 0.3s ease;
            background: #FFFBF5;
        }
        
        .chat-input input:focus {
            border-color: #FF8C00;
            box-shadow: 0 0 0 4px rgba(255, 140, 0, 0.1);
            background: #fff;
        }
        
        .chat-input button {
            background: linear-gradient(135deg, #FF8C00 0%, #FF6B00 100%);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 700;
            transition: all 0.3s ease;
            box-shadow: 0 4px 16px rgba(255, 140, 0, 0.3);
        }
        
        .chat-input button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 140, 0, 0.4);
        }
        
        /* 侧边栏 */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .viewers-panel,
        .stats-panel,
        .controls-panel {
            background: #ffffff;
            border: none;
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 8px 32px rgba(255, 140, 0, 0.08);
        }
        
        .viewers-header,
        .stats-header,
        .controls-header {
            font-weight: 700;
            font-size: 18px;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 2px solid #FFE5C0;
            color: #FF8C00;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .viewers-header::before { content: '👥'; }
        .stats-header::before { content: '📊'; }
        .controls-header::before { content: '🎛️'; }
        
        .viewer-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px;
            border-radius: 12px;
            background: #FFFBF5;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .viewer-item:last-child {
            margin-bottom: 0;
        }
        
        .viewer-item:hover {
            background: linear-gradient(135deg, #FFF5E6 0%, #FFEDD5 100%);
            transform: translateX(4px);
        }
        
        .viewer-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .viewer-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, #E0F7FA 0%, #B2EBF2 100%);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }
        
        .viewer-name {
            font-size: 15px;
            font-weight: 600;
            color: #333;
        }
        
        .manage-btn {
            background: linear-gradient(135deg, #FF8C00 0%, #FF6B00 100%);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(255, 140, 0, 0.3);
        }
        
        .manage-btn:hover {
            transform: scale(1.05);
        }
        
        /* 统计卡片 */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            text-align: center;
        }
        
        .stat-item {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 16px;
            background: linear-gradient(145deg, #FFFBF5 0%, #FFF5E6 100%);
            border-radius: 16px;
            transition: transform 0.3s ease;
        }
        
        .stat-item:hover {
            transform: translateY(-4px);
        }
        
        .stat-value {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, #FF8C00 0%, #FF6B00 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .stat-value.pk {
            background: linear-gradient(135deg, #7b61ff 0%, #6a52e0 100%);
            -webkit-background-clip: text;
            background-clip: text;
        }
        
        .stat-label {
            font-size: 14px;
            color: #666;
            font-weight: 500;
        }
        
        /* 点赞按钮 */
        .like-btn {
            background: linear-gradient(135deg, #FFE5C0 0%, #FFD4A8 100%);
            border: none;
            padding: 12px 32px;
            border-radius: 24px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            color: #FF8C00;
            transition: all 0.3s ease;
            margin-top: 8px;
        }
        
        .like-btn:hover {
            background: linear-gradient(135deg, #FF8C00 0%, #FF6B00 100%);
            color: white;
            transform: scale(1.05);
            box-shadow: 0 4px 16px rgba(255, 140, 0, 0.3);
        }
        
        /* 控制按钮 */
        .control-buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        
        .control-btn {
            background: #FFFBF5;
            border: 2px solid #FFE5C0;
            padding: 12px 18px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            color: #666;
        }
        
        .control-btn:hover {
            background: linear-gradient(135deg, #FFF5E6 0%, #FFEDD5 100%);
            border-color: #FF8C00;
            color: #FF8C00;
            transform: translateY(-2px);
        }
        
        .control-btn.primary {
            background: linear-gradient(135deg, #FF8C00 0%, #FF6B00 100%);
            color: white;
            border: none;
            box-shadow: 0 4px 16px rgba(255, 140, 0, 0.3);
        }
        
        .control-btn.pk {
            background: linear-gradient(135deg, #7b61ff 0%, #6a52e0 100%);
            color: white;
            border: none;
            box-shadow: 0 4px 16px rgba(123, 97, 255, 0.3);
        }
        
        .control-btn.primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 140, 0, 0.4);
        }
        
        .control-btn.pk:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(123, 97, 255, 0.4);
        }

        /* PK相关样式 */
        .pk-container {
            display: none;
            margin-top: 24px;
            padding-top: 24px;
            border-top: 2px dashed #FFE5C0;
        }
        
        .pk-container.active {
            display: block;
        }
        
        .pk-opponent {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .pk-opponent > div:first-child {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(135deg, #7b61ff 0%, #FF8C00 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .pk-stats {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
            gap: 24px;
        }
        
        .pk-team {
            text-align: center;
            flex: 1;
            padding: 16px;
            background: #FFFBF5;
            border-radius: 16px;
        }
        
        .pk-team-name {
            font-weight: 700;
            margin-bottom: 12px;
            font-size: 15px;
            color: #333;
        }
        
        .pk-progress {
            height: 10px;
            background-color: #f0f0f0;
            border-radius: 5px;
            margin: 12px 0;
            overflow: hidden;
        }
        
        .pk-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #FF8C00, #FFB347);
            width: 50%;
            border-radius: 5px;
            transition: width 0.5s ease;
        }
        
        .pk-progress-fill.opponent {
            background: linear-gradient(90deg, #7b61ff, #9d8cff);
        }
        
        /* 连麦请求提示 */
        .request-notification {
            position: fixed;
            top: 100px;
            right: 24px;
            background: white;
            padding: 16px 20px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
            border: none;
            display: none;
            z-index: 1000;

    <script>
        // ============ 通知主框架当前页面状态 ============
        function notifyParentPage() {
            if (window.parent !== window) {
                // 发送页面状态消息给主框架
                window.parent.postMessage({
                    type: 'PAGE_STATE',
                    data: { 
                        pageName: 'live', 
                        state: 'hidden-paused'  // 直播页：不显示且播放暂停
                    }
                }, '*');
                
                console.log('已通知主框架：直播页（不显示播放栏，暂停播放）');
            }
        }

        // 页面加载时通知主框架
        window.addEventListener('load', function() {
            setTimeout(notifyParentPage, 100); // 延迟确保主框架准备好
        });

        // 如果页面是通过iframe直接加载的，立即通知
        if (window.parent !== window) {
            notifyParentPage();
        }

        // ============ 原有的直播功能代码保持不变 ============
        // 数据统计相关变量
        let viewerCount = 32;
        let likeCount = 3;
        let liveStartTime = new Date();
        liveStartTime.setMinutes(liveStartTime.getMinutes() - 35); // 模拟已直播35分钟
        let isInPk = false;
        let pkOurScore = 12;
        let pkOpponentScore = 8;
        let pkRemainingTime = 300; // 5分钟，单位：秒
        let currentRequester = null;

        // DOM元素
        const viewerCountEl = document.getElementById('viewer-count');
        const likeCountEl = document.getElementById('like-count');
        const liveDurationEl = document.getElementById('live-duration');
        const likeBtn = document.getElementById('like-btn');
        const chatMessagesEl = document.getElementById('chat-messages');
        const messageInputEl = document.getElementById('message-input');
        const sendMessageBtn = document.getElementById('send-message');
        const inviteBtn = document.getElementById('invite-btn');
        const acceptBtn = document.getElementById('accept-btn');
        const rejectBtn = document.getElementById('reject-btn');
        const startPkBtn = document.getElementById('start-pk-btn');
        const endPkBtn = document.getElementById('end-pk-btn');
        const liveStatusEl = document.getElementById('live-status');
        const pkContainerEl = document.getElementById('pk-container');
        const ourPkProgressEl = document.getElementById('our-pk-progress');
        const opponentPkProgressEl = document.getElementById('opponent-pk-progress');
        const pkRemainingTimeEl = document.getElementById('pk-remaining-time');
        const requestNotificationEl = document.getElementById('request-notification');
        const requesterNameEl = document.getElementById('requester-name');
        const acceptRequestBtn = document.getElementById('accept-request');
        const rejectRequestBtn = document.getElementById('reject-request');
        const viewerItems = [
            document.getElementById('viewer-1'),
            document.getElementById('viewer-2'),
            document.getElementById('viewer-3')
        ];

        // 更新直播时长
        function updateLiveDuration() {
            const now = new Date();
            const durationMs = now - liveStartTime;
            const minutes = Math.floor(durationMs / 60000);
            const seconds = Math.floor((durationMs % 60000) / 1000);
            liveDurationEl.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
        }

        // 随机更新观看人数
        function randomUpdateViewerCount() {
            if (Math.random() > 0.7) { // 30%概率更新
                const change = Math.floor(Math.random() * 5) - 2; // -2到2之间的随机数
                viewerCount = Math.max(1, viewerCount + change);
                viewerCountEl.textContent = viewerCount;
            }
        }

        // 更新PK进度
        function updatePkProgress() {
            const total = pkOurScore + pkOpponentScore;
            const ourPercent = total > 0 ? (pkOurScore / total) * 100 : 50;
            const opponentPercent = 100 - ourPercent;

            ourPkProgressEl.style.width = `${ourPercent}%`;
            opponentPkProgressEl.style.width = `${opponentPercent}%`;

            // 更新剩余时间
            const minutes = Math.floor(pkRemainingTime / 60);
            const seconds = pkRemainingTime % 60;
            pkRemainingTimeEl.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;

            // 随机增加PK分数
            if (Math.random() > 0.85) {
                if (Math.random() > 0.5) {
                    pkOurScore++;
                } else {
                    pkOpponentScore++;
                }
            }
        }

        // 发送消息
        function sendMessage(sender, content, isHost = false) {
            const now = new Date();
            const timeStr = `${now.getFullYear()}.${(now.getMonth() + 1).toString().padStart(2, '0')}.${now.getDate().toString().padStart(2, '0')} ${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;

            const messageEl = document.createElement('div');
            messageEl.className = `message ${isHost ? 'host' : 'student'}`;
            messageEl.innerHTML = `
                <div class="message-sender">${sender}</div>
                <div class="message-content">${content}</div>
                <div class="message-time">${timeStr}</div>
            `;

            chatMessagesEl.appendChild(messageEl);
            chatMessagesEl.scrollTop = chatMessagesEl.scrollHeight; // 滚动到底部
        }

        // 显示系统消息
        function showSystemMessage(content) {
            const now = new Date();
            const timeStr = `${now.getFullYear()}.${(now.getMonth() + 1).toString().padStart(2, '0')}.${now.getDate().toString().padStart(2, '0')} ${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;

            const messageEl = document.createElement('div');
            messageEl.className = 'message system';
            messageEl.innerHTML = `
                <div class="message-sender">系统消息</div>
                <div class="message-content">${content}</div>
                <div class="message-time">${timeStr}</div>
            `;

            chatMessagesEl.appendChild(messageEl);
            chatMessagesEl.scrollTop = chatMessagesEl.scrollHeight;
        }

        // 发起连麦请求
        function requestConnection(viewerId, viewerName) {
            currentRequester = { id: viewerId, name: viewerName };
            requesterNameEl.textContent = viewerName;
            requestNotificationEl.classList.add('active');

            // 30秒后自动拒绝
            setTimeout(() => {
                if (requestNotificationEl.classList.contains('active')) {
                    rejectConnection();
                }
            }, 30000);
        }

        // 接受连麦
        function acceptConnection() {
            if (currentRequester) {
                showSystemMessage(`${currentRequester.name} 已连麦`);
                viewerItems[currentRequester.id - 1].querySelector('.manage-btn').textContent = '断开';
            }
            requestNotificationEl.classList.remove('active');
            currentRequester = null;
        }

        // 拒绝连麦
        function rejectConnection() {
            if (currentRequester) {
                showSystemMessage(`已拒绝 ${currentRequester.name} 的连麦请求`);
            }
            requestNotificationEl.classList.remove('active');
            currentRequester = null;
        }

        // 开始PK
        function startPK() {
            isInPk = true;
            liveStatusEl.classList.add('pk');
            liveStatusEl.textContent = '直播中 - PK进行中';
            pkContainerEl.classList.add('active');
            startPkBtn.style.display = 'none';
            endPkBtn.style.display = 'inline-flex';
            showSystemMessage('PK已开始，双方加油！');
        }

        // 结束PK
        function endPK() {
            isInPk = false;
            liveStatusEl.classList.remove('pk');
            liveStatusEl.textContent = '直播中';
            pkContainerEl.classList.remove('active');
            startPkBtn.style.display = 'inline-flex';
            endPkBtn.style.display = 'none';

            let result = '';
            if (pkOurScore > pkOpponentScore) {
                result = '我方获胜！';
            } else if (pkOurScore < pkOpponentScore) {
                result = '对方获胜！';
            } else {
                result = '双方平局！';
            }

            showSystemMessage(`PK已结束，${result} 比分: ${pkOurScore} - ${pkOpponentScore}`);

            // 重置PK数据
            pkOurScore = 0;
            pkOpponentScore = 0;
            pkRemainingTime = 300;
        }

        // 事件监听
        likeBtn.addEventListener('click', () => {
            likeCount++;
            likeCountEl.textContent = likeCount;

            // PK期间点赞增加分数
            if (isInPk) {
                pkOurScore++;
                updatePkProgress();
            }
        });

        sendMessageBtn.addEventListener('click', () => {
            const content = messageInputEl.value.trim();
            if (content) {
                const username = localStorage.getItem('username') || '用户';
                sendMessage(username, content);
                messageInputEl.value = '';
            }
        });

        messageInputEl.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessageBtn.click();
            }
        });

        inviteBtn.addEventListener('click', () => {
            // 随机邀请一个观众
            const randomIndex = Math.floor(Math.random() * viewerItems.length);
            const viewerName = viewerItems[randomIndex].querySelector('.viewer-name').textContent;
            showSystemMessage(`已邀请 ${viewerName} 连麦`);
        });

        acceptBtn.addEventListener('click', acceptConnection);
        rejectBtn.addEventListener('click', rejectConnection);
        acceptRequestBtn.addEventListener('click', acceptConnection);
        rejectRequestBtn.addEventListener('click', rejectConnection);

        startPkBtn.addEventListener('click', startPK);
        endPkBtn.addEventListener('click', endPK);

        // 为每个观众项添加连麦请求事件
        viewerItems.forEach((item, index) => {
            const manageBtn = item.querySelector('.manage-btn');
            const viewerName = item.querySelector('.viewer-name').textContent;

            manageBtn.addEventListener('click', () => {
                if (manageBtn.textContent === '连麦') {
                    requestConnection(index + 1, viewerName);
                } else {
                    showSystemMessage(`${viewerName} 已断开连麦`);
                    manageBtn.textContent = '连麦';
                }
            });
        });

        // 定时更新数据
        setInterval(updateLiveDuration, 1000);
        setInterval(randomUpdateViewerCount, 5000);

        // PK定时更新
        setInterval(() => {
            if (isInPk) {
                pkRemainingTime--;
                updatePkProgress();

                if (pkRemainingTime <= 0) {
                    endPK();
                }
            }
        }, 1000);

        // 模拟实时消息
        setInterval(() => {
            if (Math.random() > 0.7 && !isInPk) { // 30%概率发送模拟消息
                const students = ['学生1', '学生2', '学生3'];
                const randomStudent = students[Math.floor(Math.random() * students.length)];
                const messages = [
                    '老师，这个问题我不太懂',
                    '能再讲一遍吗？',
                    '我明白了，谢谢老师',
                    '这个知识点好难啊',
                    '有没有相关的资料可以参考？'
                ];
                const randomMessage = messages[Math.floor(Math.random() * messages.length)];
                sendMessage(randomStudent, randomMessage);
            }
        }, 15000);
    </script>

<script>
    // 检查用户是否已登录
    function checkLoginStatus() {
        const authToken = localStorage.getItem('authToken');
        const authSection = document.getElementById('auth-section');
        
        if (authToken) {
            // 用户已登录，显示用户菜单
            authSection.innerHTML = `
                <div class="user-menu">
                    <button class="submit-btn" onclick="showUserMenu()">个人中心</button>
                    <div class="dropdown-menu" id="user-dropdown" style="display: none;">

                        <a href="#" class="dropdown-item" onclick="logout()">退出登录</a>
                    </div>
                </div>
            `;
            
            // 更新用户信息区
            const usernameElement = document.querySelector('.username');
            if (usernameElement) {
                usernameElement.textContent = '已登录用户';
            }
        }
    }
    
    // 显示用户菜单
    function showUserMenu() {
        const dropdown = document.getElementById('user-dropdown');
        dropdown.style.display = dropdown.style.display === 'none' ? 'block' : 'none';
    }
    
    // 登出功能
    function logout() {
        localStorage.removeItem('authToken');
        location.reload();
    }
    
    // 页面加载时检查登录状态
    window.addEventListener('DOMContentLoaded', checkLoginStatus);
    
    // 点击其他区域关闭下拉菜单
    document.addEventListener('click', function(event) {
        const dropdown = document.getElementById('user-dropdown');
        const userMenu = document.querySelector('.user-menu');
        
        if (dropdown && userMenu && !userMenu.contains(event.target)) {
            dropdown.style.display = 'none';
        }
    });
</script>

        text-decoration: none;

    }
    
    .dropdown-item:hover {
        background-color: #f5f5f5;
    }
</style>


<!-- 登录状态检查脚本 -->
<script>
    // 检查用户是否已登录
    function checkLoginStatus() {
        const authToken = localStorage.getItem('authToken');
        const authSection = document.getElementById('auth-section');
        
        if (authToken) {
            // 用户已登录，显示用户菜单
            authSection.innerHTML = `
                <div class="user-menu">
                    <button class="submit-btn" onclick="showUserMenu()">个人中心</button>
                    <div class="dropdown-menu" id="user-dropdown" style="display: none;">
                        <a href="my-profile.html" class="dropdown-item">我的资料</a>
                        <a href="#" class="dropdown-item" onclick="logout()">退出登录</a>
                    </div>
                </div>
            `;
            
            // 更新用户信息区
            const usernameElement = document.querySelector('.username');
            if (usernameElement) {
                usernameElement.textContent = '已登录用户';
            }
        }
    }
    
    // 显示用户菜单
    function showUserMenu() {
        const dropdown = document.getElementById('user-dropdown');
        dropdown.style.display = dropdown.style.display === 'none' ? 'block' : 'none';
    }
    
    // 登出功能
    function logout() {
        localStorage.removeItem('authToken');
        location.reload();
    }
    
    // 页面加载时检查登录状态
    window.addEventListener('DOMContentLoaded', checkLoginStatus);
    
    // 点击其他区域关闭下拉菜单
    document.addEventListener('click', function(event) {
        const dropdown = document.getElementById('user-dropdown');
        const userMenu = document.querySelector('.user-menu');
        
        if (dropdown && userMenu && !userMenu.contains(event.target)) {
            dropdown.style.display = 'none';
        }
    });
</script>

<style>
    .user-menu {
        position: relative;
        display: inline-block;
    }
    
    .dropdown-menu {
        position: absolute;
        top: 100%;
        right: 0;
        background-color: white;
        min-width: 150px;
        box-shadow: 0 8px 16px rgba(0,0,0,0.1);
        border-radius: 4px;
        z-index: 1000;
        margin-top: 5px;
    }
    
    .dropdown-item {
        display: block;
        padding: 10px 15px;
        color: #333;
        text-decoration: none;
        font-size: 14px;
    }
    
    .dropdown-item:hover {
        background-color: #f5f5f5;
    }
</style>
</body>
</html>
