    <style>
        /* 私信页面特有样式（保留原样） */
        .message-area {
            display: flex;
            gap: 20px;
            min-height: 500px;
        }
        .message-list {
            width: 280px;
            background-color: #FFF8DC;
            border: 1px solid #FFDAB9;
            border-radius: 8px;
            overflow: hidden;
        }
        .msg-item {
            display: flex;
            align-items: center;
            padding: 15px;
            cursor: pointer;
            border-bottom: 1px solid #FFDAB9;
            transition: background-color 0.3s;
        }
        .msg-item:hover { background-color: #FFEDCC; }
        .msg-item.active { background-color: #FF8C00; color: #fff; }
        .msg-item.active .avatar { background-color: #fff; }
        .msg-item .avatar-wrapper { width: 40px; height: 40px; margin-right: 12px; }
        .msg-item .avatar { width: 36px; height: 36px; background-color: #FF8C00; }
        .msg-item span { font-size: 14px; font-weight: bold; }

        .chat-window {
            flex: 1;
            background-color: #fff;
            border: 1px solid #FFDAB9;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .chat-header {
            background-color: #FF8C00;
            color: #fff;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #FFDAB9;
        }
        .chat-header .avatar-wrapper { width: 40px; height: 40px; margin-right: 12px; }
        .chat-header .avatar { width: 36px; height: 36px; background-color: #fff; }
        .chat-header span { font-size: 16px; font-weight: bold; }

        .chat-content {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background-color: #FFF8DC;
        }
        .chat-message {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 15px;
            position: relative;
        }
        .chat-message.received {
            background-color: #fff;
            border: 1px solid #FFDAB9;
            color: #333;
            margin-right: auto;
        }
        .chat-message.sent {
            background-color: #FF8C00;
            color: #fff;
            margin-left: auto;
        }
        .chat-message .time {
            display: block;
            font-size: 11px;
            color: #999;
            margin-top: 5px;
            text-align: right;
        }
        .chat-message.sent .time { color: rgba(255, 255, 255, 0.8); }

        .chat-input-area {
            padding: 15px 20px;
            border-top: 1px solid #FFDAB9;
            background-color: #fff;
            display: flex;
            gap: 10px;
        }
        .chat-input-area input {
            flex: 1;
            padding: 10px 15px;
            border: 1px solid #FFDAB9;
            border-radius: 20px;
            outline: none;
            font-size: 14px;
        }
        .chat-input-area button {
            background-color: #FF8C00;
            color: #fff;
            border: none;
            padding: 10px 25px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        .chat-input-area button:hover { background-color: #ff6b00; }

        /* 响应式设计（保留原样） */
        @media (max-width: 768px) {
            .message-area { flex-direction: column; }
            .message-list { width: 100%; max-height: 200px; overflow-y: auto; }
            .chat-window { min-height: 400px; }
        }

        /* 为固定播放栏预留空间 */
        body { padding-bottom: 96px; }

        /* PlayBar（来自 PlayBar.html）样式：完整替换播放栏相关样式 */
        .pv-player-bar {
          position: fixed; left: 0; right: 0; bottom: 0;
          width: 100%; height: 96px; background: #ffffff;
          border-top: 1px solid #e0e0e0; box-shadow: 0 -4px 20px rgba(0,0,0,0.08);
          z-index: 29999; display: flex; align-items: center; user-select: none; pointer-events: auto;
        }
        .pv-inner {
          width: 100%; max-width: 1200px; margin: 0 auto;
          display: grid;
          grid-template-columns: auto 1fr auto; /* 左侧自适应，中间占满，右侧自适应 */
          align-items: center;
          column-gap: 16px;
          padding: 0 24px;
          height: 100%;
        }
        .pv-left { display: inline-flex; align-items: center; gap: 12px; min-width: 240px; }
        .pv-cover {
          width: 52px; height: 52px; border-radius: 8px;
          background: #eee no-repeat center/cover;
          box-shadow: 0 2px 6px rgba(0,0,0,0.1);
          flex-shrink: 0;
        }
        .pv-meta { display: flex; flex-direction: column; min-width: 0; }
        .pv-title {
          font-size: 16px; font-weight: 700; color: #222;
          white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .pv-artist {
          font-size: 12px; color: #666; margin-top: 2px;
          white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .pv-center {
          display: flex; flex-direction: column; align-items: center; justify-content: center;
          gap: 8px; min-width: 0;
        }
        .pv-controls {
          display: inline-flex; align-items: center; gap: 18px;
        }
        .ctrl-btn, .mode-btn, .rate-btn {
          background: transparent; border: none; cursor: pointer; color: #444;
          font-size: 18px; padding: 6px; display: inline-flex; align-items: center; justify-content: center; transition: color 0.2s;
        }
        .ctrl-btn:hover, .mode-btn:hover, .rate-btn:hover { color: #ff8c00; }
        .play-btn {
          width: 44px; height: 44px; border-radius: 50%; background: #ff8c00; color: #fff; border: none;
          display: inline-flex; align-items: center; justify-content: center; cursor: pointer;
          box-shadow: 0 4px 10px rgba(255,140,0,0.30); transition: transform 0.1s, background 0.2s;
        }
        .play-btn:hover { background: #e67e00; transform: scale(1.05); }
        .icon { width: 18px; height: 18px; fill: currentColor; }

        /* 进度条行 */
        .pv-progress-row { display: flex; align-items: center; gap: 12px; width: 100%; }
        .time.small { font-size: 12px; color: #888; width: 48px; text-align: center; font-variant-numeric: tabular-nums; }
        .pv-progress { position: relative; flex: 1; height: 6px; background: #eee; border-radius: 3px; cursor: pointer; touch-action: none; }
        .pv-progress::before { content: ''; position: absolute; top: -10px; bottom: -10px; left: 0; right: 0; z-index: 1; }
        .pv-progress-fill { position: absolute; left: 0; top: 0; bottom: 0; background: #ff8c00; border-radius: 3px; width: 0%; pointer-events: none; }
        .pv-knob { position: absolute; top: 50%; right: -6px; transform: translateY(-50%); width: 12px; height: 12px; background: #fff; border: 2px solid #ff8c00; border-radius: 50%; box-shadow: 0 1px 4px rgba(0,0,0,0.2); opacity: 0; transition: opacity 0.2s; pointer-events: none; }
        .pv-progress:hover .pv-knob, .pv-progress.dragging .pv-knob { opacity: 1; }

        /* 右侧：音量 + 歌单 */
        .pv-right { display: inline-flex; align-items: center; justify-content: flex-end; gap: 12px; min-width: 240px; }
        .pv-volume { width: 140px; height: 20px; display: flex; align-items: center; cursor: pointer; position: relative; }
        .pv-volume-bar { width: 100%; height: 4px; background: #eee; border-radius: 2px; position: relative; overflow: visible; pointer-events: none; }
        .pv-volume-fill { height: 100%; background: #888; width: 50%; border-radius: 2px; position: relative; }
        .pv-volume-fill::after { content: ''; position: absolute; right: -5px; top: 50%; transform: translateY(-50%); width: 10px; height: 10px; background: #fff; border: 1px solid #888; border-radius: 50%; opacity: 0; transition: opacity 0.2s; }
        .pv-volume:hover .pv-volume-fill::after { opacity: 1; }

        /* 弹层：循环模式与倍速菜单 */
        .popover {
          position: absolute; bottom: 100%;
          left: 50%; transform: translateX(-50%);
          background: #fff; border: 1px solid #ddd; border-radius: 8px;
          box-shadow: 0 10px 24px rgba(0,0,0,0.12);
          padding: 8px; z-index: 30000; display: none;
        }
        .popover.show { display: flex; }
        .mode-popover { gap: 10px; align-items: center; }
        .mode-item {
          width: 40px; height: 40px; border-radius: 8px; border: 1px solid #eee;
          display: inline-flex; align-items: center; justify-content: center; cursor: pointer; color: #444;
        }
        .mode-item:hover { color: #ff8c00; border-color: #ffeed6; background: #fff9f0; }
        .mode-item.active { color: #fff; background: #ff8c00; border-color: #ff8c00; }
        .rate-popover { flex-direction: column; min-width: 140px; }
        .rate-item { padding: 8px 12px; font-size: 14px; color: #333; cursor: pointer; border-radius: 6px; }
        .rate-item:hover { background: #f7f7f7; }
        .rate-item.active { color: #ff8c00; font-weight: 700; background: #fff4e6; }

        /* 响应式 */
        @media (max-width: 900px) {
          .pv-left { min-width: 0; }
          .pv-right { min-width: 0; }
          .pv-inner { grid-template-columns: auto 1fr auto; column-gap: 10px; padding: 0 12px; }
        }
    </style>

            <script>
            // ============ 通知主框架当前页面状态 ============
            // 第一种情况：显示且播放不暂停
            function notifyParentPage() {
                if (window.parent !== window) {
                    window.parent.postMessage({
                        type: 'PAGE_STATE',
                        data: {
                            pageName: 'my-message',
                            state: 'visible-playing' // 私信页：显示播放栏且播放不暂停
                        }
                    }, '*');
                    // 控制台提示
                    console.log('已通知主框架：my-message（显示播放栏，播放不中断）');
                }
            }

            // 页面加载时通知主框架
            window.addEventListener('load', function() {
                setTimeout(notifyParentPage, 100); // 延迟确保主框架准备好
            });

            // 如果页面是通过iframe直接加载的，立即通知
            if (window.parent !== window) {
                notifyParentPage();
            }
            </script>

    <!-- 保留私信页面交互脚本（与播放栏无关） -->
    <script>
        // 解析URL参数
        function getURLParameter(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }

        let msgItems = document.querySelectorAll('.msg-item');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const chatContent = document.querySelector('.chat-content');
        const chatHeaderName = document.querySelector('.chat-header span');

        // 页面加载时检查URL参数
        window.addEventListener('DOMContentLoaded', () => {
            const username = getURLParameter('username');
            if (username) {
                let found = false;
                msgItems.forEach(item => {
                    const itemName = item.querySelector('span').textContent;
                    if (itemName === username) {
                        item.click(); // 自动点击对应的消息列表项
                        found = true;
                    }
                });

                if (!found) {
                    const messageList = document.querySelector('.message-list');
                    const newMsgItem = document.createElement('div');
                    newMsgItem.className = 'msg-item active';
                    newMsgItem.innerHTML = `
                        <div class="avatar-wrapper">
                            <div class="avatar"></div>
                        </div>
                        <span>${username}</span>
                    `;
                    msgItems.forEach(item => item.classList.remove('active'));
                    messageList.appendChild(newMsgItem);
                    msgItems = document.querySelectorAll('.msg-item');
                    newMsgItem.addEventListener('click', () => {
                        msgItems.forEach(item => item.classList.remove('active'));
                        newMsgItem.classList.add('active');
                        const name = newMsgItem.querySelector('span').textContent;
                        chatHeaderName.textContent = name;
                        chatContent.innerHTML = `<div class="chat-message received">
                            开始与${name}的对话
                            <span class="time">${getCurrentTime()}</span>
                        </div>`;
                        chatContent.scrollTop = chatContent.scrollHeight;
                    });
                    chatHeaderName.textContent = username;
                    chatContent.innerHTML = `<div class="chat-message received">
                        开始与${username}的对话
                        <span class="time">${getCurrentTime()}</span>
                    </div>`;
                    chatContent.scrollTop = chatContent.scrollHeight;
                }
            }
        });

        // 切换对话
        msgItems.forEach(item => {
            item.addEventListener('click', () => {
                msgItems.forEach(i => i.classList.remove('active'));
                item.classList.add('active');
                const name = item.querySelector('span').textContent;
                document.querySelector('.chat-header span').textContent = name;
                chatContent.innerHTML = `<div class="chat-message received">
                    开始与${name}的对话
                    <span class="time">${getCurrentTime()}</span>
                </div>`;
                chatContent.scrollTop = chatContent.scrollHeight;
            });
        });

        // 发送消息
        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') { sendMessage(); }
        });

        function sendMessage() {
            const message = messageInput.value.trim();
            if (message === '') return;
            const newMessage = document.createElement('div');
            newMessage.className = 'chat-message sent';
            newMessage.innerHTML = `${message}<span class="time">${getCurrentTime()}</span>`;
            chatContent.appendChild(newMessage);
            messageInput.value = '';
            chatContent.scrollTop = chatContent.scrollHeight;

            setTimeout(() => {
                const replies = ['好的，收到了','明白了，谢谢','我会注意的','这个建议不错','继续努力'];
                const randomReply = replies[Math.floor(Math.random() * replies.length)];
                const replyMessage = document.createElement('div');
                replyMessage.className = 'chat-message received';
                replyMessage.innerHTML = `${randomReply}<span class="time">${getCurrentTime()}</span>`;
                chatContent.appendChild(replyMessage);
                chatContent.scrollTop = chatContent.scrollHeight;
            }, 3000);
        }

        function getCurrentTime() {
            const now = new Date();
            const year = now.getFullYear();
            const month = (now.getMonth() + 1).toString().padStart(2, '0');
            const day = now.getDate().toString().padStart(2, '0');
            const hours = now.getHours().toString().padStart(2, '0');
            const minutes = now.getMinutes().toString().padStart(2, '0');
            return `${year}.${month}.${day} ${hours}:${minutes}`;
        }
    </script>

    <!-- 头像同步脚本 -->
    <script>
    (function() {
        // 从 sessionStorage 加载用户资料
        function syncUserProfile() {
            const saved = sessionStorage.getItem('userProfile');
            if (saved) {
                const userProfile = JSON.parse(saved);
                
                // 更新用户名
                const usernameEl = document.getElementById('displayUsername');
                if (usernameEl) {
                    usernameEl.textContent = userProfile.username;
                }
                
                // 更新头像
                const avatarEl = document.getElementById('userAvatar');
                if (avatarEl) {
                    if (userProfile.avatarType === 'custom' && userProfile.avatarUrl) {
                        avatarEl.style.background = `url('${userProfile.avatarUrl}') center/cover no-repeat`;
                        avatarEl.textContent = '';
                    } else {
                        const lightenColor = (color, percent) => {
                            const num = parseInt(color.replace('#', ''), 16);
                            const amt = Math.round(2.55 * percent);
                            const R = (num >> 16) + amt;
                            const G = (num >> 8 & 0x00FF) + amt;
                            const B = (num & 0x0000FF) + amt;
                            return '#' + (0x1000000 + (R < 255 ? R < 1 ? 0 : R : 255) * 0x10000 +
                                (G < 255 ? G < 1 ? 0 : G : 255) * 0x100 +
                                (B < 255 ? B < 1 ? 0 : B : 255)).toString(16).slice(1);
                        };
                        avatarEl.style.background = `linear-gradient(135deg, ${userProfile.avatarColor}, ${lightenColor(userProfile.avatarColor, 30)})`;
                        avatarEl.textContent = userProfile.avatarEmoji || '';
                        avatarEl.style.display = 'flex';
                        avatarEl.style.alignItems = 'center';
                        avatarEl.style.justifyContent = 'center';
                        avatarEl.style.fontSize = '28px';
                    }
                }
            }
        }
        
        document.addEventListener('DOMContentLoaded', syncUserProfile);
    })();
    </script>
