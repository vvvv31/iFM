<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的-创作者中心 - 星之声</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="../js/search.js"></script>
    <style>
        /* 创作者中心特有样式 - 补充 style.css */
        .creator-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background-color: white;
            border: 1px solid #FFDAB9;
            border-radius: 8px;
            padding: 25px;
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(255, 140, 0, 0.1);
        }
        .stat-value {
            font-size: 32px;
            font-weight: bold;
            color: #FF8C00;
            margin-bottom: 10px;
        }
        .stat-label { color: #666; font-size: 16px; }

        .creator-actions {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }
        .action-card {
            background-color: white;
            border: 1px solid #FFDAB9;
            border-radius: 8px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .action-card:hover {
            background-color: #FFF8DC;
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(255, 140, 0, 0.1);
        }
        .action-icon {
            font-size: 36px;
            color: #FF8C00;
            margin-bottom: 15px;
            width: 60px; height: 60px;
            display: flex; align-items: center; justify-content: center;
            background-color: #FFF8DC; border-radius: 50%;
        }
        .action-title { font-size: 18px; font-weight: bold; margin-bottom: 10px; color: #333; }
        .action-desc { color: #666; font-size: 14px; line-height: 1.4; }

        /* 作品卡片样式 */
        .work-title {
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
            font-size: 16px;
        }
        .work-stats {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }
        .work-author {
            font-size: 12px;
            color: #FF8C00;
            margin-top: 5px;
            font-weight: 500;
        }
        .channel-card {
            background-color: white;
            border: 1px solid #FFDAB9;
            border-radius: 8px;
            padding: 15px;
            text-align: left;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .channel-card:hover {
            background-color: #FFF8DC;
            transform: translateY(-3px);
            box-shadow: 0 3px 10px rgba(255, 140, 0, 0.1);
        }
        .channel-cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        @media (max-width: 768px) {
            .creator-stats { grid-template-columns: 1fr; gap: 15px; }
            .creator-actions { grid-template-columns: 1fr; gap: 15px; }
            .stat-card, .action-card { padding: 20px; }
            .stat-value { font-size: 28px; }
            .action-icon { font-size: 32px; width: 50px; height: 50px; }
            .channel-cards { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
            
            /* 编辑模态框响应式 */
            .edit-modal {
                width: 90%;
            }
            
            /* 裁剪模态框响应式 */
            .crop-modal {
                width: 90%;
            }
            
            .crop-container {
                height: 300px;
            }
        }
        @media (max-width: 480px) {
            .creator-stats, .creator-actions { gap: 10px; }
            .stat-card, .action-card { padding: 15px; }
            .stat-value { font-size: 24px; }
            .action-title { font-size: 16px; }
            .channel-cards { grid-template-columns: 1fr; }
            
            /* 编辑模态框响应式 */
            .edit-modal {
                width: 95%;
                padding: 15px;
            }
            
            .edit-modal-header h3 {
                font-size: 20px;
            }
            
            .edit-form-group input {
                font-size: 14px;
            }
            
            /* 裁剪模态框响应式 */
            .crop-modal {
                width: 95%;
                padding: 15px;
            }
            
            .crop-modal-header h3 {
                font-size: 20px;
            }
            
            .crop-container {
                height: 250px;
            }
            
            .crop-hint {
                font-size: 13px;
            }
            
            .crop-controls {
                flex-direction: column;
                gap: 10px;
            }
            
            .crop-modal-footer {
                flex-direction: column;
                gap: 10px;
            }
            
            .crop-btn-cancel, .crop-btn-confirm {
                width: 100%;
            }
        }

        /* 用户信息编辑功能样式（与my-recent.html保持一致） */
        .user-info {
            position: relative;
        }

        .avatar-wrapper {
            position: relative;
            cursor: pointer;
        }

        .avatar-wrapper:hover .avatar-edit-overlay {
            opacity: 1;
        }

        .avatar-edit-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .avatar-edit-overlay i {
            color: #fff;
            font-size: 20px;
        }

        /* 与 my-recent.html 保持一致的用户名编辑按钮样式（可复用） */
        .username-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .edit-username-btn {
            background: none;
            border: none;
            color: #999;
            cursor: pointer;
            padding: 4px;
            font-size: 14px;
            transition: color 0.2s;
            display: flex;
            align-items: center;
        }

        .edit-username-btn:hover {
            color: #FF8C00;
        }

        /* 编辑模态框样式（与my-recent.html保持一致） */
        .edit-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 99999;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .edit-modal-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        .edit-modal {
            background: #fff;
            border-radius: 16px;
            width: 90%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            transform: scale(0.9) translateY(20px);
            transition: transform 0.3s ease;
            overflow: hidden;
        }

        .edit-modal-overlay.show .edit-modal {
            transform: scale(1) translateY(0);
        }

        .edit-modal-header {
            padding: 20px 24px;
            border-bottom: 1px solid #eee;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .edit-modal-header h3 {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin: 0;
        }

        .edit-modal-close {
            background: none;
            border: none;
            font-size: 24px;
            color: #999;
            cursor: pointer;
            padding: 0;
            line-height: 1;
            transition: color 0.2s;
        }

        .edit-modal-close:hover {
            color: #333;
        }

        .edit-modal-body {
            padding: 24px;
        }

        .edit-avatar-section {
            text-align: center;
            margin-bottom: 24px;
        }

        .edit-avatar-preview {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, #FF8C00 0%, #FFB366 100%);
            margin: 0 auto 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: #fff;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .edit-avatar-preview:hover {
            transform: scale(1.05);
        }

        .edit-avatar-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .edit-avatar-preview .avatar-placeholder {
            font-size: 40px;
        }

        .avatar-upload-hint {
            font-size: 13px;
            color: #999;
        }

        .avatar-upload-hint i {
            margin-right: 4px;
        }

        .edit-form-group {
            margin-bottom: 20px;
        }

        .edit-form-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #333;
            margin-bottom: 8px;
        }

        .edit-form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.2s;
            box-sizing: border-box;
        }

        .edit-form-group input:focus {
            outline: none;
            border-color: #FF8C00;
            box-shadow: 0 0 0 3px rgba(255, 140, 0, 0.1);
        }

        .edit-form-group .char-count {
            text-align: right;
            font-size: 12px;
            color: #999;
            margin-top: 6px;
        }

        .edit-form-group .char-count.warning {
            color: #ff4444;
        }

        .edit-modal-footer {
            padding: 16px 24px 24px;
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }

        .edit-btn-cancel,
        .edit-btn-save {
            padding: 10px 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .edit-btn-cancel {
            background: #f5f5f5;
            border: 1px solid #e0e0e0;
            color: #666;
        }

        .edit-btn-cancel:hover {
            background: #eee;
        }

        .edit-btn-save {
            background: linear-gradient(135deg, #FF8C00 0%, #FFB366 100%);
            border: none;
            color: #fff;
        }

        .edit-btn-save:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(255, 140, 0, 0.3);
        }

        .edit-btn-save:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* 头像选项 */
        .avatar-options {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            margin-top: 16px;
            padding: 16px;
            background: #f9f9f9;
            border-radius: 12px;
        }

        .avatar-option {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            cursor: pointer;
            border: 3px solid transparent;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .avatar-option:hover {
            transform: scale(1.1);
        }

        .avatar-option.selected {
            border-color: #FF8C00;
            box-shadow: 0 0 0 3px rgba(255, 140, 0, 0.2);
        }

        /* Toast 提示 */
        .toast-notification {
            position: fixed;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: #333;
            color: #fff;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 999999;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .toast-notification.show {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }

        .toast-notification.success {
            background: linear-gradient(135deg, #4CAF50 0%, #66BB6A 100%);
        }

        .toast-notification i {
            margin-right: 8px;
        }

        /* 头像裁剪模态框样式 */
        .crop-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .crop-modal-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        .crop-modal {
            background: #fff;
            border-radius: 16px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            transform: scale(0.9);
            transition: transform 0.3s ease;
            overflow: hidden;
        }

        .crop-modal-overlay.show .crop-modal {
            transform: scale(1);
        }

        .crop-modal-header {
            padding: 16px 20px;
            border-bottom: 1px solid #eee;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .crop-modal-header h3 {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin: 0;
        }

        .crop-modal-close {
            background: none;
            border: none;
            font-size: 24px;
            color: #999;
            cursor: pointer;
            padding: 0;
            line-height: 1;
        }

        .crop-modal-close:hover {
            color: #333;
        }

        .crop-container {
            position: relative;
            width: 100%;
            height: 350px;
            background: #1a1a1a;
            overflow: hidden;
            cursor: grab;
        }

        .crop-container:active {
            cursor: grabbing;
        }

        .crop-image {
            position: absolute;
            transform-origin: center center;
            user-select: none;
            -webkit-user-drag: none;
        }

        .crop-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
        }

        .crop-circle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 200px;
            height: 200px;
            border: 3px solid #fff;
            border-radius: 50%;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.6);
        }

        .crop-controls {
            padding: 16px 20px;
            background: #f9f9f9;
        }

        .crop-zoom-control {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .crop-zoom-control label {
            font-size: 14px;
            color: #666;
            min-width: 60px;
        }

        .crop-zoom-slider {
            flex: 1;
            height: 6px;
            -webkit-appearance: none;
            appearance: none;
            background: #ddd;
            border-radius: 3px;
            outline: none;
        }

        .crop-zoom-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            background: #FF8C00;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(255, 140, 0, 0.4);
        }

        .crop-zoom-slider::-moz-range-thumb {
            width: 18px;
            height: 18px;
            background: #FF8C00;
            border-radius: 50%;
            cursor: pointer;
            border: none;
            box-shadow: 0 2px 6px rgba(255, 140, 0, 0.4);
        }

        .zoom-value {
            font-size: 14px;
            color: #666;
            min-width: 45px;
            text-align: right;
        }

        .crop-modal-footer {
            padding: 0 20px 20px;
            background: #f9f9f9;
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }

        .crop-btn-cancel,
        .crop-btn-confirm {
            padding: 10px 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .crop-btn-cancel {
            background: #f5f5f5;
            border: 1px solid #e0e0e0;
            color: #666;
        }

        .crop-btn-cancel:hover {
            background: #eee;
        }

        .crop-btn-confirm {
            background: linear-gradient(135deg, #FF8C00 0%, #FFB366 100%);
            border: none;
            color: #fff;
        }

        .crop-btn-confirm:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(255, 140, 0, 0.3);
        }

        .crop-hint {
            text-align: center;
            font-size: 12px;
            color: #999;
            padding: 8px 20px 0;
            background: #f9f9f9;
        }

        /* 预留底部播放栏空间 */
        body { padding-bottom: 96px; }

        /* PlayBar（来自 PlayBar.html）样式 */
        .pv-player-bar {
          position: fixed; left: 0; right: 0; bottom: 0;
          width: 100%; height: 96px; background: #ffffff;
          border-top: 1px solid #e0e0e0; box-shadow: 0 -4px 20px rgba(0,0,0,0.08);
          z-index: 29999; display: flex; align-items: center; user-select: none; pointer-events: auto;
        }
        .pv-inner {
          width: 100%; max-width: 1200px; margin: 0 auto;
          display: grid;
          grid-template-columns: auto 1fr auto; /* 左侧自适应，中间占满，右侧自适应 */
          align-items: center;
          column-gap: 16px;
          padding: 0 24px;
          height: 100%;
        }

        /* 左侧：封面 + 标题/歌手，紧贴最左边 */
        .pv-left {
          display: inline-flex;
          align-items: center;
          gap: 12px;
          min-width: 240px;
        }
        .pv-cover {
          width: 52px; height: 52px; border-radius: 8px;
          background: #eee no-repeat center/cover;
          box-shadow: 0 2px 6px rgba(0,0,0,0.1);
          flex-shrink: 0;
        }
        .pv-meta {
          display: flex; flex-direction: column; min-width: 0;
        }
        .pv-title {
          font-size: 16px; font-weight: 700; color: #222;
          white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .pv-artist {
          font-size: 12px; color: #666; margin-top: 2px;
          white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        /* 中间：控制 + 进度，居中 */
        .pv-center {
          display: flex; flex-direction: column; align-items: center; justify-content: center;
          gap: 8px; min-width: 0;
        }
        .pv-controls {
          display: inline-flex; align-items: center; gap: 18px;
        }
        .ctrl-btn, .mode-btn, .rate-btn {
          background: transparent; border: none; cursor: pointer; color: #444;
          font-size: 18px; padding: 6px; display: inline-flex; align-items: center; justify-content: center; transition: color 0.2s;
        }
        .ctrl-btn:hover, .mode-btn:hover, .rate-btn:hover { color: #ff8c00; }
        .play-btn {
          width: 44px; height: 44px; border-radius: 50%; background: #ff8c00; color: #fff; border: none;
          display: inline-flex; align-items: center; justify-content: center; cursor: pointer;
          box-shadow: 0 4px 10px rgba(255,140,0,0.30); transition: transform 0.1s, background 0.2s;
        }
        .play-btn:hover { background: #e67e00; transform: scale(1.05); }
        .icon { width: 18px; height: 18px; fill: currentColor; }

        /* 进度条行 */
        .pv-progress-row { display: flex; align-items: center; gap: 12px; width: 100%; }
        .time.small { font-size: 12px; color: #888; width: 48px; text-align: center; font-variant-numeric: tabular-nums; }
        .pv-progress { position: relative; flex: 1; height: 6px; background: #eee; border-radius: 3px; cursor: pointer; touch-action: none; }
        .pv-progress::before { content: ''; position: absolute; top: -10px; bottom: -10px; left: 0; right: 0; z-index: 1; }
        .pv-progress-fill { position: absolute; left: 0; top: 0; bottom: 0; background: #ff8c00; border-radius: 3px; width: 0%; pointer-events: none; }
        .pv-knob { position: absolute; top: 50%; right: -6px; transform: translateY(-50%); width: 12px; height: 12px; background: #fff; border: 2px solid #ff8c00; border-radius: 50%; box-shadow: 0 1px 4px rgba(0,0,0,0.2); opacity: 0; transition: opacity 0.2s; pointer-events: none; }
        .pv-progress:hover .pv-knob, .pv-progress.dragging .pv-knob { opacity: 1; }

        /* 右侧：音量 + 歌单，紧贴最右边 */
        .pv-right {
          display: inline-flex; align-items: center; justify-content: flex-end;
          gap: 12px; min-width: 240px;
        }
        .pv-volume { width: 140px; height: 20px; display: flex; align-items: center; cursor: pointer; position: relative; }
        .pv-volume-bar { width: 100%; height: 4px; background: #eee; border-radius: 2px; position: relative; overflow: visible; pointer-events: none; }
        .pv-volume-fill { height: 100%; background: #888; width: 50%; border-radius: 2px; position: relative; }
        .pv-volume-fill::after { content: ''; position: absolute; right: -5px; top: 50%; transform: translateY(-50%); width: 10px; height: 10px; background: #fff; border: 1px solid #888; border-radius: 50%; opacity: 0; transition: opacity 0.2s; }
        .pv-volume:hover .pv-volume-fill::after { opacity: 1; }

        /* 弹层：循环模式与倍速菜单（靠按钮居中上弹） */
        .popover {
          position: absolute; bottom: 100%;
          left: 50%; transform: translateX(-50%);
          background: #fff; border: 1px solid #ddd; border-radius: 8px;
          box-shadow: 0 10px 24px rgba(0,0,0,0.12);
          padding: 8px; z-index: 30000; display: none;
        }
        .popover.show { display: flex; }
        .mode-popover { gap: 10px; align-items: center; }
        .mode-item {
          width: 40px; height: 40px; border-radius: 8px; border: 1px solid #eee;
          display: inline-flex; align-items: center; justify-content: center; cursor: pointer; color: #444;
        }
        .mode-item:hover { color: #ff8c00; border-color: #ffeed6; background: #fff9f0; }
        .mode-item.active { color: #fff; background: #ff8c00; border-color: #ff8c00; }
        .rate-popover { flex-direction: column; min-width: 140px; }
        .rate-item { padding: 8px 12px; font-size: 14px; color: #333; cursor: pointer; border-radius: 6px; }
        .rate-item:hover { background: #f7f7f7; }

<script>
// ============ 用户资料编辑功能（与my-recent.html保持一致） ============
let userProfile = {
    username: '用户名',
    avatarType: 'preset', // 'preset' 或 'custom'
    avatarColor: '#FF8C00',
    avatarEmoji: '⭐',
    avatarUrl: ''
};

// 从 sessionStorage 加载用户数据（关闭浏览器后清除）
function loadUserProfile() {
    // 清除旧的 localStorage 数据（一次性迁移）
    if (localStorage.getItem('userProfile')) {
        localStorage.removeItem('userProfile');
    }
    
    const saved = sessionStorage.getItem('userProfile');
    if (saved) {
        userProfile = JSON.parse(saved);
        updateDisplayedProfile();
    }
}

// 更新页面显示的用户资料
function updateDisplayedProfile() {
    // 更新用户名
    const usernameEl = document.getElementById('displayUsername');
    if (usernameEl) {
        usernameEl.textContent = userProfile.username;
    }

    // 更新头像
    const avatarEl = document.getElementById('userAvatar');
    if (avatarEl) {
        if (userProfile.avatarType === 'custom' && userProfile.avatarUrl) {
            avatarEl.style.background = `url('${userProfile.avatarUrl}') center/cover no-repeat`;
            avatarEl.textContent = '';
        } else {
            avatarEl.style.background = `linear-gradient(135deg, ${userProfile.avatarColor}, ${lightenColor(userProfile.avatarColor, 30)})`;
            avatarEl.textContent = userProfile.avatarEmoji || '';
            avatarEl.style.display = 'flex';
            avatarEl.style.alignItems = 'center';
            avatarEl.style.justifyContent = 'center';
            avatarEl.style.fontSize = '28px';
        }
    }
}

// 颜色变亮函数
function lightenColor(color, percent) {
    const num = parseInt(color.replace('#', ''), 16);
    const amt = Math.round(2.55 * percent);
    const R = (num >> 16) + amt;
    const G = (num >> 8 & 0x00FF) + amt;
    const B = (num & 0x0000FF) + amt;
    return '#' + (0x1000000 + (R < 255 ? R < 1 ? 0 : R : 255) * 0x10000 +
        (G < 255 ? G < 1 ? 0 : G : 255) * 0x100 +
        (B < 255 ? B < 1 ? 0 : B : 255)).toString(16).slice(1);
}

// 打开编辑模态框
function openEditModal(focusField) {
    const modal = document.getElementById('editModalOverlay');
    const usernameInput = document.getElementById('editUsernameInput');
    
    // 填充当前数据
    usernameInput.value = userProfile.username;
    updateCharCount();
    
    // 更新头像预览
    updateAvatarPreview();
    
    // 显示模态框
    modal.classList.add('show');
    
    // 根据点击来源聚焦
    if (focusField === 'username') {
        setTimeout(() => usernameInput.focus(), 300);
    }
}

// 关闭编辑模态框
function closeEditModal() {
    const modal = document.getElementById('editModalOverlay');
    modal.classList.remove('show');
}

// 更新头像预览
function updateAvatarPreview() {
    const preview = document.getElementById('editAvatarPreview');
    const placeholder = document.getElementById('avatarPlaceholder');
    const previewImg = document.getElementById('avatarPreviewImg');
    
    if (userProfile.avatarType === 'custom' && userProfile.avatarUrl) {
        previewImg.src = userProfile.avatarUrl;
        previewImg.style.display = 'block';
        placeholder.style.display = 'none';
        preview.style.background = 'transparent';
    } else {
        previewImg.style.display = 'none';
        placeholder.style.display = 'block';
        placeholder.textContent = userProfile.avatarEmoji || '👤';
        preview.style.background = `linear-gradient(135deg, ${userProfile.avatarColor}, ${lightenColor(userProfile.avatarColor, 30)})`;
    }
    
    // 更新选中状态
    document.querySelectorAll('.avatar-option').forEach(opt => {
        opt.classList.remove('selected');
    });
}

// 选择预设头像
function selectPresetAvatar(element, color) {
    const emoji = element.textContent;
    
    userProfile.avatarType = 'preset';
    userProfile.avatarColor = color;
    userProfile.avatarEmoji = emoji;
    userProfile.avatarUrl = '';
    
    // 更新选中状态
    document.querySelectorAll('.avatar-option').forEach(opt => {
        opt.classList.remove('selected');
    });
    element.classList.add('selected');
    
    // 更新预览
    const preview = document.getElementById('editAvatarPreview');
    const placeholder = document.getElementById('avatarPlaceholder');
    const previewImg = document.getElementById('avatarPreviewImg');
    
    previewImg.style.display = 'none';
    placeholder.style.display = 'block';
    placeholder.textContent = emoji;
    preview.style.background = `linear-gradient(135deg, ${color}, ${lightenColor(color, 30)})`;
}

// 预览自定义头像 - 打开裁剪器
function previewAvatar(input) {
    if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
            openCropModal(e.target.result);
        };
        reader.readAsDataURL(input.files[0]);
    }
}

// ========== 头像裁剪功能 ==========
let cropState = {
    originalImage: '',
    scale: 1,
    offsetX: 0,
    offsetY: 0,
    isDragging: false,
    startX: 0,
    startY: 0,
    imageWidth: 0,
    imageHeight: 0
};

// 打开裁剪模态框
function openCropModal(imageSrc) {
    const modal = document.getElementById('cropModalOverlay');
    const cropImage = document.getElementById('cropImage');
    const slider = document.getElementById('cropZoomSlider');
    
    cropState.originalImage = imageSrc;
    cropState.scale = 1;
    cropState.offsetX = 0;
    cropState.offsetY = 0;
    
    slider.value = 100;
    document.getElementById('zoomValue').textContent = '100%';
    
    cropImage.onload = function() {
        cropState.imageWidth = this.naturalWidth;
        cropState.imageHeight = this.naturalHeight;
        centerImage();
    };
    cropImage.src = imageSrc;
    
    modal.classList.add('show');
    initCropEvents();
}

// 关闭裁剪模态框
function closeCropModal() {
    const modal = document.getElementById('cropModalOverlay');
    modal.classList.remove('show');
    // 清空文件输入
    document.getElementById('avatarFileInput').value = '';
}

// 居中图片
function centerImage() {
    const container = document.getElementById('cropContainer');
    const cropImage = document.getElementById('cropImage');
    
    const containerRect = container.getBoundingClientRect();
    const circleSize = 200;
    
    // 计算图片显示尺寸使其能覆盖裁剪圆
    const imgRatio = cropState.imageWidth / cropState.imageHeight;
    let displayWidth, displayHeight;
    
    if (imgRatio > 1) {
        displayHeight = circleSize * 1.2;
        displayWidth = displayHeight * imgRatio;
    } else {
        displayWidth = circleSize * 1.2;
        displayHeight = displayWidth / imgRatio;
    }
    
    cropImage.style.width = displayWidth + 'px';
    cropImage.style.height = displayHeight + 'px';
    
    // 居中定位
    cropState.offsetX = (containerRect.width - displayWidth) / 2;
    cropState.offsetY = (containerRect.height - displayHeight) / 2;
    
    updateImageTransform();
}

// 更新图片变换
function updateImageTransform() {
    const cropImage = document.getElementById('cropImage');
    cropImage.style.left = cropState.offsetX + 'px';
    cropImage.style.top = cropState.offsetY + 'px';
    cropImage.style.transform = `scale(${cropState.scale})`;
}

// 初始化裁剪事件
function initCropEvents() {
    const container = document.getElementById('cropContainer');
    const slider = document.getElementById('cropZoomSlider');
    
    // 拖动事件
    container.onmousedown = function(e) {
        e.preventDefault();
        cropState.isDragging = true;
        cropState.startX = e.clientX - cropState.offsetX;
        cropState.startY = e.clientY - cropState.offsetY;
    };
    
    document.onmousemove = function(e) {
        if (!cropState.isDragging) return;
        cropState.offsetX = e.clientX - cropState.startX;
        cropState.offsetY = e.clientY - cropState.startY;
        updateImageTransform();
    };
    
    document.onmouseup = function() {
        cropState.isDragging = false;
    };
    
    // 触摸事件
    container.ontouchstart = function(e) {
        e.preventDefault();
        const touch = e.touches[0];
        cropState.isDragging = true;
        cropState.startX = touch.clientX - cropState.offsetX;
        cropState.startY = touch.clientY - cropState.offsetY;
    };
    
    container.ontouchmove = function(e) {
        if (!cropState.isDragging) return;
        const touch = e.touches[0];
        cropState.offsetX = touch.clientX - cropState.startX;
        cropState.offsetY = touch.clientY - cropState.startY;
        updateImageTransform();
    };
    
    container.ontouchend = function() {
        cropState.isDragging = false;
    };
    
    // 滚轮缩放
    container.onwheel = function(e) {
        e.preventDefault();
        const delta = e.deltaY > 0 ? -10 : 10;
        const newValue = Math.min(300, Math.max(100, parseInt(slider.value) + delta));
        slider.value = newValue;
        updateZoom(newValue);
    };
    
    // 滑块缩放
    slider.oninput = function() {
        updateZoom(this.value);
    };
}

// 更新缩放
function updateZoom(value) {
    cropState.scale = value / 100;
    document.getElementById('zoomValue').textContent = value + '%';
    updateImageTransform();
}

// 确认裁剪
function confirmCrop() {
    const container = document.getElementById('cropContainer');
    const cropImage = document.getElementById('cropImage');
    const containerRect = container.getBoundingClientRect();
    
    // 裁剪圆的位置（容器中心）
    const circleSize = 200;
    const circleCenterX = containerRect.width / 2;
    const circleCenterY = containerRect.height / 2;
    const circleLeft = circleCenterX - circleSize / 2;
    const circleTop = circleCenterY - circleSize / 2;
    
    // 图片当前显示尺寸和位置
    const imgDisplayWidth = cropImage.offsetWidth * cropState.scale;
    const imgDisplayHeight = cropImage.offsetHeight * cropState.scale;
    const imgLeft = cropState.offsetX - (cropImage.offsetWidth * (cropState.scale - 1)) / 2;
    const imgTop = cropState.offsetY - (cropImage.offsetHeight * (cropState.scale - 1)) / 2;
    
    // 计算裁剪区域在原图中的位置
    const scaleRatioX = cropState.imageWidth / imgDisplayWidth;
    const scaleRatioY = cropState.imageHeight / imgDisplayHeight;
    
    const cropX = (circleLeft - imgLeft) * scaleRatioX;
    const cropY = (circleTop - imgTop) * scaleRatioY;
    const cropSize = circleSize * scaleRatioX;
    
    // 使用 Canvas 进行裁剪
    const canvas = document.createElement('canvas');
    canvas.width = 200;
    canvas.height = 200;
    const ctx = canvas.getContext('2d');
    
    // 创建圆形裁剪
    ctx.beginPath();
    ctx.arc(100, 100, 100, 0, Math.PI * 2);
    ctx.closePath();
    ctx.clip();
    
    const img = new Image();
    img.onload = function() {
        ctx.drawImage(img, cropX, cropY, cropSize, cropSize, 0, 0, 200, 200);
        
        // 获取裁剪后的图片
        const croppedDataUrl = canvas.toDataURL('image/png');
        
        // 更新用户资料
        userProfile.avatarType = 'custom';
        userProfile.avatarUrl = croppedDataUrl;
        
        // 更新编辑模态框中的预览
        const preview = document.getElementById('editAvatarPreview');
        const placeholder = document.getElementById('avatarPlaceholder');
        const previewImg = document.getElementById('avatarPreviewImg');
        
        previewImg.src = croppedDataUrl;
        previewImg.style.display = 'block';
        placeholder.style.display = 'none';
        preview.style.background = 'transparent';
        
        // 取消预设选中
        document.querySelectorAll('.avatar-option').forEach(opt => {
            opt.classList.remove('selected');
        });
        
        closeCropModal();
        showToast('头像已裁剪', 'success');
    };
    img.src = cropState.originalImage;
}

// 保存用户资料
function saveProfile() {
    const usernameInput = document.getElementById('editUsernameInput');
    const newUsername = usernameInput.value.trim();
    
    if (!newUsername) {
        showToast('用户名不能为空', 'error');
        return;
    }
    
    userProfile.username = newUsername;
    
    // 保存到 sessionStorage（关闭浏览器后清除，下次打开恢复初始状态）
    sessionStorage.setItem('userProfile', JSON.stringify(userProfile));
    
    // 更新页面显示
    updateDisplayedProfile();
    
    // 关闭模态框
    closeEditModal();
    
    // 显示成功提示
    showToast('保存成功！', 'success');
}

// 显示 Toast 提示
function showToast(message, type = 'success') {
    const toast = document.getElementById('toastNotification');
    const msgEl = document.getElementById('toastMessage');
    
    msgEl.textContent = message;
    toast.className = 'toast-notification ' + type;
    toast.classList.add('show');
    
    setTimeout(() => {
        toast.classList.remove('show');
    }, 2500);
}

// ============ 关注/粉丝弹窗功能（与my-recent.html保持一致） ============
function openFollowModal(type) {
    if (document.getElementById('globalFollowModalFrame')) return;
    const mask = document.createElement('div');
    mask.style.cssText = 'position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(0,0,0,0.18);z-index:999999;display:flex;align-items:center;justify-content:center;';
    mask.id = 'globalFollowModalFrame';
    mask.innerHTML = `<iframe src="follow-modal.html?mode=${type}" style="border:none;width:100vw;max-width:440px;height:90vh;max-height:500px;background:#fff;z-index:1000000;border-radius:16px;box-shadow:0 8px 40px rgba(0,0,0,0.18);"></iframe>`;
    document.body.appendChild(mask);
    function applyFollowData(payload){
        if(!payload) return;
        const f = document.getElementById('followingCount');
        const g = document.getElementById('fansCount');
        if(f && payload.followingCount !== undefined) f.textContent = payload.followingCount;
        if(g && payload.fansCount !== undefined) g.textContent = payload.fansCount;
    }
    window.addEventListener('message', function handler(e) {
        const msgType = (typeof e.data === 'string') ? (function(){try{return JSON.parse(e.data).type}catch(e){return e.data}})() : (e.data && e.data.type);
        if (msgType === 'close-follow-modal' || msgType === 'closeFollowModal') {
            mask.remove();
            window.removeEventListener('message', handler);
        } else if (msgType === 'followDataUpdated'){
            const payload = (typeof e.data === 'string') ? (function(){try{return JSON.parse(e.data).data}catch(e){return null}})() : (e.data && e.data.data);
            applyFollowData(payload);
        }
    });
}

// 初始化时从 sessionStorage 读取并刷新计数
(function(){
    function refreshCountsFromStore(){
        try{
            const raw = sessionStorage.getItem('fakeFollowData_v1');
            if(!raw) return;
            const st = JSON.parse(raw);
            if(st.followingCount!==undefined){ const el = document.getElementById('followingCount'); if(el) el.textContent = st.followingCount; }
            if(st.fansCount!==undefined){ const el = document.getElementById('fansCount'); if(el) el.textContent = st.fansCount; }
        }catch(e){}
    }
    if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', refreshCountsFromStore); else refreshCountsFromStore();
})();
</script>

<script>
    // 检查用户是否已登录
    function checkLoginStatus() {
        const authToken = localStorage.getItem('authToken');
        const authSection = document.getElementById('auth-section');
        
        if (authToken) {
            // 用户已登录，显示用户菜单

                        <a href="my-profile.html" class="dropdown-item">我的资料</a>
                        <a href="#" class="dropdown-item" onclick="logout()">退出登录</a>
                    </div>
                </div>
            `;
            // 不再覆盖 .username 的内容，保持真实用户名
        }
    }
    
    // 显示用户菜单
    function showUserMenu() {
        const dropdown = document.getElementById('user-dropdown');
        dropdown.style.display = dropdown.style.display === 'none' ? 'block' : 'none';
    }
    
    // 登出功能
    function logout() {
        localStorage.removeItem('authToken');
        location.reload();
    }
    
    // 页面加载时检查登录状态
    window.addEventListener('DOMContentLoaded', checkLoginStatus);
    
    // 点击其他区域关闭下拉菜单
    document.addEventListener('click', function(event) {
        const dropdown = document.getElementById('user-dropdown');
        const userMenu = document.querySelector('.user-menu');
        
        if (dropdown && userMenu && !userMenu.contains(event.target)) {
            dropdown.style.display = 'none';
        }
    });
</script>
